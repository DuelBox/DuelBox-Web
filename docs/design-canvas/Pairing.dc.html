<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c9852f; text-decoration: none; } a:hover { color: #e0a04d; }
  </style>
</helmet>
<div style="width: 1080px; height: 700px; background: #14100d; color: #f0e9de; font-family: 'Instrument Sans', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 26px 40px 4px; display: flex; flex-direction: column; gap: 6px;">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.15em; color: #8a7a66;">TWO DEVICES, ONE MATCH</div>
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 34px; letter-spacing: -0.01em;">Deal them in</div>
  </div>

  <div style="flex: 1; display: flex; align-items: center; gap: 0; padding: 0 40px;">

    <div style="width: 300px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div style="width: 168px; height: 250px; border-radius: 12px; border: 1px solid #4a3b28; background: #1d1710; padding: 13px; display: flex; flex-direction: column;">
        <div style="flex: 1; border-radius: 6px; background: radial-gradient(110% 80% at 50% 40%, #24402f, #16261d); display: flex; align-items: center; justify-content: center;">
          <div style="width: 34px; height: 34px; border-radius: 50%; border: 3px solid #d96a44;"></div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #d96a44;"></div>
        <div style="font-size: 14.5px;">This phone</div>
      </div>
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a08f79;">READY</div>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 22px; padding: 0 20px;">
      <div style="width: 148px; height: 148px; border-radius: 8px; background: #f0e9de; padding: 13px; box-shadow: 0 12px 30px rgba(0,0,0,0.5);">
        <div style="width: 100%; height: 100%; background:
          repeating-conic-gradient(#2a2118 0% 25%, #f0e9de 0% 50%) 0 0 / 22px 22px;
          border-radius: 2px;"></div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 9px;">
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.14em; color: #8a7a66;">OR READ IT OUT</div>
        <div style="display: flex; gap: 7px;">
          <div style="width: 46px; height: 58px; border-radius: 5px; background: #f0e9de; color: #2a2118; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 26px;">K</div>
          <div style="width: 46px; height: 58px; border-radius: 5px; background: #f0e9de; color: #2a2118; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 26px;">4</div>
          <div style="width: 46px; height: 58px; border-radius: 5px; background: #f0e9de; color: #2a2118; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 26px;">T</div>
          <div style="width: 46px; height: 58px; border-radius: 5px; background: #f0e9de; color: #2a2118; display: flex; align-items: center; justify-content: center; font-family: 'JetBrains Mono', monospace; font-size: 26px;">9</div>
        </div>
        <div style="font-size: 13px; color: #8a7a66;">duelbox.com/j/K4T9</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; width: 100%;">
        <div style="flex: 1; height: 1px; background: linear-gradient(90deg, transparent, #c9852f);"></div>
        <div style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #c9852f; letter-spacing: 0.12em;">WAITING</div>
        <div style="flex: 1; height: 1px; background: linear-gradient(90deg, #c9852f, transparent);"></div>
      </div>
    </div>

    <div style="width: 300px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
      <div style="width: 236px; height: 168px; border-radius: 10px; border: 1px dashed #4a3b28; background: #1a1510; padding: 12px; display: flex; align-items: center; justify-content: center;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4a3b28" stroke-width="1.5"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/></svg>
          <div style="font-size: 13px; color: #a08f79;">Their laptop, phone or tablet</div>
        </div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; border: 1px solid #3aa88c;"></div>
        <div style="font-size: 14.5px; color: #8a7a66;">Not joined yet</div>
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 22px; padding: 20px 40px; border-top: 1px solid #2e2418;">
    <div style="font-size: 13.5px; color: #a89a86;">Both of you see the same board, letterboxed to the same size — a bigger screen never sees more of the game.</div>
    <div style="margin-left: auto; display: flex; gap: 9px;">
      <div style="padding: 10px 17px; border: 1px solid #2e2418; border-radius: 3px; font-size: 13.5px; color: #a89a86;">Play the bot instead</div>
      <div style="padding: 10px 17px; border: 1px solid #4a3b28; border-radius: 3px; font-size: 13.5px;">Share the link</div>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
