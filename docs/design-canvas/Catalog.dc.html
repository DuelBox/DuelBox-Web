<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #c9852f; text-decoration: none; } a:hover { color: #e0a04d; }
  </style>
</helmet>
<div style="width: 1200px; height: 900px; background: #14100d; color: #f0e9de; font-family: 'Instrument Sans', system-ui, sans-serif; overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; gap: 16px; padding: 18px 40px; border-bottom: 1px solid #2e2418;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 21px;">DuelBox</div>
    <div style="flex: 1; max-width: 420px; display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1d1710; border: 1px solid #2e2418; border-radius: 3px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8a7a66" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <div style="font-size: 13.5px; color: #8a7a66;">Search 107 games</div>
    </div>
    <div style="margin-left: auto; display: flex; gap: 3px; padding: 3px; background: #1d1710; border: 1px solid #2e2418; border-radius: 3px;">
      <div style="padding: 7px 13px; font-size: 12.5px; border-radius: 2px; background: #33241c; color: #f0e9de;">Two of us</div>
      <div style="padding: 7px 13px; font-size: 12.5px; color: #8a7a66;">Two devices</div>
      <div style="padding: 7px 13px; font-size: 12.5px; color: #8a7a66;">Just me</div>
    </div>
  </div>

  <div style="display: flex; gap: 8px; padding: 16px 40px 12px; align-items: center;">
    <div style="padding: 7px 14px; border-radius: 99px; background: #c9852f; color: #14100d; font-size: 12.5px; font-weight: 500;">All 107</div>
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
      <div style="padding: 7px 14px; border-radius: 99px; border: 1px solid #2e2418; font-size: 12.5px; color: #a89a86;">{{c.name}} <span style="color: #a08f79; font-family: 'JetBrains Mono', monospace; font-size: 11px;">{{c.n}}</span></div>
    </sc-for>
    <div style="margin-left: auto; display: flex; align-items: center; gap: 7px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8a7a66;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8a7a66" stroke-width="1.8"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      UNDER 60s
    </div>
  </div>

  <div style="padding: 4px 40px 10px; display: flex; align-items: baseline; gap: 10px;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 19px;">Back to what you play</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a08f79;">RECENT</div>
  </div>
  <div style="display: flex; gap: 10px; padding: 0 40px 18px;">
    <sc-for list="{{recent}}" as="g" hint-placeholder-count="5">
      <div style="width: 148px; display: flex; flex-direction: column; gap: 8px;">
        <div style="height: 96px; border-radius: 5px; background: {{g.tint}}; position: relative; overflow: hidden;">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: {{g.side}};"></div>
        </div>
        <div style="font-size: 13.5px;">{{g.name}}</div>
      </div>
    </sc-for>
  </div>

  <div style="height: 1px; margin: 0 40px; background: #2e2418;"></div>

  <div style="padding: 18px 40px 8px; display: flex; align-items: baseline; gap: 10px;">
    <div style="font-family: 'Instrument Serif', Georgia, serif; font-size: 19px;">Sports</div>
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #a08f79;">19 GAMES</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; padding: 6px 40px 0;">
    <sc-for list="{{games}}" as="g" hint-placeholder-count="10">
      <div style="display: flex; flex-direction: column; gap: 9px;">
        <div style="height: 128px; border-radius: 6px; background: {{g.tint}}; position: relative; overflow: hidden; box-shadow: 0 5px 16px rgba(0,0,0,0.35);">
          <div style="position: absolute; inset: 0; background: linear-gradient(105deg, transparent 48%, #14100d22 48%, #14100d22 52%, transparent 52%);"></div>
          <div style="position: absolute; left: 11px; top: 11px; display: flex; gap: 5px;">
            <div style="width: 7px; height: 7px; border-radius: 50%; background: #d96a44;"></div>
            <div style="width: 7px; height: 7px; border-radius: 50%; background: #3aa88c;"></div>
          </div>
          <div style="position: absolute; right: 11px; top: 11px; font-family: 'JetBrains Mono', monospace; font-size: 9.5px; color: #14100daa;">{{g.len}}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 14px; font-weight: 500;">{{g.name}}</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #a08f79; letter-spacing: 0.05em;">{{g.modes}}</div>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {
      cats: [
        { name: 'Party', n: '20' }, { name: 'Sports', n: '19' }, { name: 'Board', n: '14' },
        { name: 'Shooter', n: '8' }, { name: 'Reaction', n: '7' }, { name: 'Arena', n: '7' },
        { name: 'Racing', n: '7' }, { name: 'Solo', n: '7' }
      ],
      recent: [
        { name: 'Mini Golf', tint: '#e8e0d2', side: '#d96a44' },
        { name: 'Air Hockey', tint: '#dcd3c2', side: '#3aa88c' },
        { name: 'Drop Four', tint: '#e8e0d2', side: '#d96a44' },
        { name: 'Spin War', tint: '#dcd3c2', side: '#3aa88c' },
        { name: 'Quick Draw', tint: '#e8e0d2', side: '#c9852f' }
      ],
      games: [
        { name: 'Air Hockey', tint: '#e8e0d2', len: '90s', modes: 'BOTH · BOT' },
        { name: 'Ping Pong', tint: '#dcd3c2', len: '75s', modes: 'BOTH · BOT' },
        { name: 'Tennis', tint: '#e3d9c8', len: '90s', modes: 'BOTH · BOT' },
        { name: 'Bowling', tint: '#dcd3c2', len: '2m', modes: 'BOTH · BOT' },
        { name: 'Crabby Volley', tint: '#e8e0d2', len: '60s', modes: 'BOTH · BOT' },
        { name: 'Beach Ball', tint: '#e3d9c8', len: '45s', modes: 'BOTH · BOT' },
        { name: 'Sling Puck', tint: '#dcd3c2', len: '90s', modes: 'BOTH · BOT' },
        { name: 'Soccer Pool', tint: '#e8e0d2', len: '2m', modes: 'BOTH · BOT' },
        { name: 'Cup Pong', tint: '#e3d9c8', len: '90s', modes: 'BOTH · BOT' },
        { name: 'Mini Soccer', tint: '#dcd3c2', len: '60s', modes: 'BOTH · BOT' }
      ]
    };
  }
}
</script>
</body>
</html>
