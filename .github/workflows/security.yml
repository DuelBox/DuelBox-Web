name: Security

# Per-PR scanning catches what a change introduces. The nightly run catches what the
# world introduced overnight: an advisory published against a dependency we already
# have is invisible to a PR-only schedule until someone happens to open a PR.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: javascript-typescript
          # The extended suite adds the security rules that matter for a site handling
          # player-supplied strings; the default suite alone misses most injection paths.
          queries: security-extended
      - uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: /language:javascript-typescript

  dependency-review:
    name: Dependency review
    # Only meaningful on a pull request: it diffs the manifest against the base branch.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          fail-on-severity: high
          # A copyleft licence in a dependency is a legal problem for a product that
          # ships its own art and code, so it fails here rather than at launch.
          deny-licenses: AGPL-3.0, GPL-3.0, GPL-2.0
          comment-summary-in-pr: on-failure

  advisories:
    name: Advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      # --frozen-lockfile is the integrity check: it fails if the lockfile and the
      # manifests disagree, so a tampered or drifted tree cannot install quietly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high

  shipped-secrets:
    name: Secrets in shipped output
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Scans the real artefact rather than the source: a key can reach a bundle through
      # a dependency or a generated file that no source scan would look at.
      - run: pnpm build

  committed-secrets:
    name: Secrets in the repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
      # A different risk from the shipped-output scan, with a different blast radius: a key
      # in the source is in the history for ever, is visible to everyone who clones, and
      # survives every rebuild. A key that never reaches a bundle is still published.
      #
      # GitHub's own secret scanning with push protection is enabled on this repository and
      # is the first line — this is the one that runs on a fork, on a branch, and locally.
      - run: pnpm check:source-secrets
