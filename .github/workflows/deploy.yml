# Publish the site, so that people can actually play the games.
#
# The app is `output: 'export'` — a directory of files with no server runtime — so any static
# host serves it. This publishes to GitHub Pages because that needs no account the repository
# does not already have.
#
# One thing Pages cannot do: custom response headers. It ignores `_headers`, `vercel.json` and
# every server block `scripts/emit-host-config.mjs` writes, so the full generated set — HSTS,
# COOP, COEP, CORP, Permissions-Policy, X-Content-Type-Options, X-Frame-Options — reaches no
# visitor at all.
#
# That used to be written down here and nowhere else, which meant nothing executed it and #2367
# and #218 were both built on a header set nobody serves (#2481). It is now data:
# `scripts/header-delivery.mjs` classifies every generated header by how it can be delivered,
# `scripts/check-headers.mjs` fails the build if one is added without a classification, and the
# served-versus-discarded table prints on every build. `apps/web/src/security/header-delivery.test.ts`
# runs the same assertions on every push. **Change the deploy target and that check goes red**,
# because it reads this file and compares what it finds against the declared target — so this
# comment cannot go stale the way the last one did.
#
# Two things survive a header-less host and are delivered in the markup instead: the hashed CSP
# and `<meta name="referrer">`. Framing is mitigated — not fixed — by the frame guard in
# `apps/web/src/app/frame-guard.ts`. Moving to Cloudflare Pages, Netlify or Vercel restores the
# real set and needs nothing from this repository except deleting this file and updating
# `DEPLOY_TARGET` — the build output is identical, which is the point of a static export.
name: Deploy

# Triggered by CI *finishing*, not by the push. Until #2511 this fired on the same push as
# `ci.yml`, and since the deploy takes 2-4 minutes against CI's 10-18, every push published
# the site roughly ten minutes before anyone knew whether the tests had passed - and a red CI
# neither blocked the deploy nor undid it. The gate was real, thorough, and wired to nothing.
#
# `workflow_run` is the only mechanism that orders two workflows. Branch protection cannot do
# it here, because the deploy fires on a push rather than on a merge.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# One deployment at a time, and never cancel one half-done: a partially uploaded site is worse
# than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    # Publish only what passed. `workflow_run` fires on *completion*, success or not, so the
    # conclusion has to be checked explicitly - without this line the trigger change would
    # look right and change nothing, which is the failure this repository keeps finding.
    # A manual dispatch is allowed through deliberately, so a rollback is not gated on a
    # green run of the commit being rolled back to.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `workflow_run` checks out the default branch's tip by default, NOT the commit CI
          # actually tested. On a busy branch that would publish a commit nothing verified -
          # the same bug in a new place. Pin to the SHA that produced the green run.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # Deliberately no `version:` — package.json pins `packageManager`, and passing both makes
        # the action treat it as a conflict and refuse to install. That mistake cost this
        # repository 45 consecutive red CI runs before 20 August.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the static site
        # A project page serves from /<repo>/, so the build needs that prefix baked in. Derived
        # from the repository name rather than hard-coded, so a rename or a fork still works.
        run: pnpm build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          # The sitemap and every canonical URL are built from this, so they name the Pages origin.
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Stop Pages mangling the export
        # Without this, Pages runs the output through Jekyll, which silently drops every path
        # beginning with an underscore — including `_next`, which is all of the JavaScript.
        run: touch apps/web/out/.nojekyll

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/out
          # Without this the upload runs `tar --exclude='.[^/]*'` and throws away every
          # dot-path the build just wrote — `.well-known/security.txt`, which RFC 9116 makes
          # the canonical location, and the `.nojekyll` touched three lines above. Both were
          # generated correctly and neither ever reached the origin: `/security.txt` served
          # 200 and `/.well-known/security.txt` served 404 (#2513). The default is `false`,
          # so the omission looked like nothing at all.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
