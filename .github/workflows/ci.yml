name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      # `pnpm test`, not `pnpm test:coverage`. The coverage thresholds are real and they are
      # enforced in `nightly.yml`, not here — see the header of that file for why. A reader
      # looking for the coverage gate in this job will not find it, which is the point of
      # this comment (#56).
      - run: pnpm test
      # `pnpm build` runs the manifest validator and the zero-cost guard as its own steps.
      - run: pnpm build

  # e2e is its own job because it is three quarters of the wall clock and depends on none
  # of the checks above.
  #
  # It used to be the last step of `verify`, and that job was at 97% of its own timeout
  # before this branch: 662s of e2e on top of 216s of everything else, against a 15 minute
  # limit — 24 seconds of headroom. Twenty more games added 51s to `pnpm test` and it
  # started being killed mid-e2e, which reads as a flake rather than as a budget that ran
  # out. Splitting cuts wall clock from ~16 minutes to ~12 and gives both halves real room,
  # which matters because 35 more games are still to come.
  #
  # This does not close #2459 — e2e itself is still ~11 minutes and that issue asks for 8
  # overall. It stops the gate failing for the wrong reason while that is worked on.
  # ## Sharded, because this job spent months one slow minute from red
  #
  # The note above describes splitting e2e out of `verify` when that job reached 97% of its
  # timeout. The same thing happened again to the job it created: measured across eight
  # consecutive runs this job took **18, 19, 19, 19, 19 and 19 minutes against its own
  # 20-minute limit**, on `main` as well as on branches, and then a batch that added
  # sixteen tests took it to exactly 20 and it was cancelled mid-suite. A cancelled job
  # reads like an infrastructure flake rather than like a budget that ran out, which is
  # precisely the failure mode that made the last split necessary.
  #
  # Raising the limit was the wrong fix twice over: it buys one batch of headroom, and the
  # number it raises is the only signal anybody gets that the suite is growing. 35 more
  # games are still to come.
  #
  # So the suite is split across three runners by Playwright's own sharding, which divides
  # by test rather than by file and therefore stays balanced as specs are added. Wall clock
  # goes to roughly a third; the total billed minutes are unchanged apart from three builds
  # instead of one, which is the price of the wall clock. `fail-fast: false` so one shard
  # going red still lets the other two report — a suite that stops at the first failure
  # tells you about one broken thing per run.
  #
  # This still does not close #2459, which asks for 8 minutes overall. It stops the gate
  # failing for the wrong reason while that is worked on.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: e2e (${{ matrix.shard }}/3)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite drives the real static artefact rather than a dev server, so it needs the
      # build even though `verify` also produces one — the two jobs run in parallel and
      # share nothing. Each shard builds its own for the same reason.
      - run: pnpm build
      # Smoke-test the real static artefact, not a dev server, so a green run is
      # evidence the deployed site works.
      # WebKit is the engine iOS Safari ships, and two people sharing a phone is the
      # primary case — a chromium window sized like a phone is not the same test.
      - run: npx playwright install --with-deps chromium webkit
      # ## The visual baselines (#227), and the window in which they are not there yet
      #
      # `e2e/visual.spec.ts` holds five shell screens against PNGs in `e2e/__screenshots__`.
      # A screenshot is a fact about a platform, and the committed ones are `-linux` because
      # this runner is: the spec skips itself anywhere else rather than failing on a
      # developer's Mac for a reason no developer can fix.
      #
      # This step exists for the one window where no baseline is committed, and it deletes
      # itself at the end of that window. It takes the pictures from the build this job has
      # just made, so the suite below compares against them and passes, and hands them over
      # as an artefact to be committed. That is a guard that cannot fail, which is the exact
      # shape CLAUDE.md keeps a tally of — so it says so, as an annotation, on every run
      # until somebody commits the PNGs. After that `find` matches, this step returns
      # immediately, and a missing baseline is `A snapshot doesn't exist at …` and a red job.
      - id: visual
        run: |
          if [ -n "$(find e2e/__screenshots__ -name '*-linux.png' 2>/dev/null | head -n1)" ]; then
            exit 0
          fi
          echo "bootstrap=1" >> "$GITHUB_OUTPUT"
          npx playwright test e2e/visual.spec.ts --project=chromium -u changed --output=/tmp/pw-visual
          echo "::warning title=Visual baselines are not committed::e2e/visual.spec.ts compared this run against pictures taken from this same build, so it could not fail. Download the visual-baselines-${{ matrix.shard }} artefact into e2e/__screenshots__ and commit it, and this stops being true."
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.visual.outputs.bootstrap == '1'
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: e2e/__screenshots__
          if-no-files-found: error
          retention-days: 7
      # No `--` before the flag: pnpm 9 consumes that itself and the argument never reaches
      # Playwright, which then runs the whole suite on every shard — three full runs that
      # each look like a pass.
      #
      # The way to check that is still true is `npx playwright test --list`, whose total the
      # three shards have to add up to and not merely each match. A count used to be written
      # out here; it was stale within two batches, and a sharding bug is not something a
      # remembered number would have caught anyway — the command is what catches it.
      - id: suite
        run: pnpm e2e --shard=${{ matrix.shard }}/3
      # ## Accepting an intended visual change, in one command
      #
      # The suite has failed, and one reason it can have failed is that somebody meant to
      # change how a screen looks. The reviewer needs two things that only a Linux runner can
      # produce: the new baselines, and a picture of what moved. So the visual spec is run
      # again with `-u changed`, which rewrites the baselines that did not match and leaves
      # the rest alone, and both come back as artefacts:
      #
      #     gh run download <run-id> -n visual-baselines-<shard> -D e2e/__screenshots__
      #     gh run download <run-id> -n visual-diffs-<shard> -D /tmp/visual-diffs
      #
      # Look at the diffs, then commit what the first command changed. The shard is in the
      # name of the job that went red.
      #
      # `--output` keeps this run's own artefacts out of `test-results/`, which Playwright
      # empties at the start of every run and which still holds the `-diff.png` the failing
      # run left there. Conditioned on the suite step rather than on `failure()` so that a
      # broken install or a broken build does not pay for a screenshot run, and skipped
      # during the bootstrap above, whose upload has already claimed the artefact name.
      - name: Regenerate the visual baselines for review
        if: always() && steps.suite.outcome == 'failure' && steps.visual.outputs.bootstrap != '1'
        run: npx playwright test e2e/visual.spec.ts --project=chromium -u changed --output=/tmp/pw-visual-accept
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.suite.outcome == 'failure' && steps.visual.outputs.bootstrap != '1'
        with:
          name: visual-baselines-${{ matrix.shard }}
          path: e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.suite.outcome == 'failure' && steps.visual.outputs.bootstrap != '1'
        with:
          name: visual-diffs-${{ matrix.shard }}
          # Nothing at all when the failure was somebody else's spec, which is why this one
          # is `ignore` rather than `error`.
          path: |
            test-results/**/*-diff.png
            test-results/**/*-actual.png
          if-no-files-found: ignore
          retention-days: 7

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A high-severity advisory in a dependency is a release blocker, not a warning.
      # Duplicated in security.yml, which also runs nightly — an advisory published
      # against a dependency we already have is invisible to a PR-only schedule.
      - run: pnpm audit --audit-level=high
