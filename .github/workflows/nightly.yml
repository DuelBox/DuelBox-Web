name: Nightly

# Everything that is too slow to pay for on every push.
#
# Four things now. The third browser engine: the whole suite passes on Firefox and has done
# since it was first tried, so running it per-push would spend install and run time to
# re-confirm a clean result. And the seat-balance sweep, on two axes the push cannot afford:
#
#   - Depth. `balance-aggregate.test.ts` runs fifty seeds a game on every push, which enforces
#     a 23.8-76.2% band and nothing finer — enough to catch a game that has become grossly
#     one-sided. Two hundred and fifty seeds enforces 35.5-64.5%.
#   - Tier. Nothing ever set `DUELBOX_BALANCE_TIER`, so `normal` was the only tier the harness
#     had ever measured and two thirds of the bot ladder was unguarded. The first `hard` run
#     found four turn-board games that collapse to a single deterministic match, `tic-tac-toe`
#     drawing all hundred, and `checkers` no longer finishing at all; the first `easy` run
#     found `hand-slap` handing seat one 100% of the matches it hands seat two 65% of on
#     `normal`. `hard` costs three times `normal`, which is why it is here and not on a push.
#
# And the coverage gate. **It is here and not in `verify` — do not assume otherwise.** The
# thresholds in `vitest.config.ts` (70% of lines, functions, branches and statements over
# `packages/engine/src/**` and every game's `rules.ts`) had been correct and unexecuted since
# the day they were written: `ci.yml` runs `pnpm test`, and nothing under `.github/` had ever
# contained the word "coverage", so the threshold could not fail anything (#56).
#
# It is not in `verify` because running it there means running the suite twice, and the second
# run is not a duplicate of the first — it is the expensive one. v8 instrumentation slows the
# bot-search tests by several times over, which is why `vitest.config.ts` has to raise the test
# timeout to ten minutes under `DUELBOX_COVERAGE=1`. `verify` is already the job that put #2459
# on the board, so the choice was between a gate that runs nightly and a threshold that stays
# unenforced in order to protect a budget that is over anyway.
#
# The cost of that choice, stated plainly: a pull request that drops coverage below 70% merges
# green and is caught the next morning rather than in review. If that ever costs more than the
# minutes it saves, move this job into `verify` — the command is identical either way.
#
# And the memory soak (#232). `lifecycle.spec.ts` counts listeners across fifty mount-unmount
# cycles on every push and that is the right instrument for a push gate; `soak.spec.ts` runs a
# hundred and measures the heap either side, which is the acceptance criterion #232 states and
# a slower, noisier instrument than a listener count. It is here for this file's usual reason —
# a minute or two of CI to re-measure at a hundred cycles what the push gate already watches at
# fifty — and for one more that is specific to it: a heap comparison on a shared runner is the
# flakiest assertion in the suite, and a flaky test on the push gate teaches everybody to re-run
# the job rather than to read it.
#
# Half of what that job runs is a control that installs a deliberate leak and requires the
# measurement to catch it, because a threshold nobody has watched fail is not a threshold — the
# habit CLAUDE.md records after five guards in this repository turned out to be enforcing
# nothing. Measured on a development machine, both at a hundred cycles: **0.73MB of growth
# clean, 17.08MB with the control's leak installed**, against the 5MB budget between them. The
# shell releases its matches; five consecutive blocks of a hundred cycles grew 0.71, 0.21, 0.06,
# 0.011 and 0.011MB, which is a warm-up curve and not a leak.
on:
  schedule:
    # 03:15 UTC, which is a quiet hour for the free-tier runners.
    - cron: '15 3 * * *'
  workflow_dispatch:

jobs:
  all-engines:
    name: every browser engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: pnpm e2e
        env:
          # Also lets tournament.spec.ts, game-record.spec.ts and share-card.spec.ts off
          # their per-push Chromium-only list, so the catalog-to-rematch and full-tournament
          # journeys run on WebKit and Firefox too, at least once a day (#226).
          DUELBOX_ALL_ENGINES: '1'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  seat-balance:
    name: seat balance, ${{ matrix.tier }} v ${{ matrix.tier }} x ${{ matrix.seeds }} seeds
    runs-on: ubuntu-latest
    # 250 seeds on `normal` is ~10 minutes on a development machine and CI runs this work four
    # to five times slower, so the run itself can be most of an hour. The rest is install and
    # the build. `hard` at 50 seeds is ~6 minutes locally, for the same reason: its bots search.
    timeout-minutes: 75
    strategy:
      # Each tier is a separate finding. One tier going red must not cancel the evidence from
      # the other two.
      fail-fast: false
      matrix:
        include:
          # `normal` is the depth run: the sample that can resolve a two-thirds split, and the
          # tier every 1000-seed number in OUTSIDE_THE_BAND was measured on.
          - tier: normal
            seeds: 250
          # `easy` and `hard` are the breadth run. They exist because until August 2026 nothing
          # ever set DUELBOX_BALANCE_TIER at all, so a deliberate break measuring 92% for seat
          # one at `hard` read as a flat 50.0% at `normal` and the push gate stayed green. They
          # run the push sample rather than a deep one, because the numbers recorded for them
          # were measured at fifty seeds and a gate must be run at the sample its record was
          # taken at. Deepening a tier means re-recording it first — that is an issue, not a
          # config change. `hard` at 250 seeds would also be an hour of runner on its own.
          - tier: easy
            seeds: 50
          - tier: hard
            seeds: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The registry loads every game from its `dist`, and `tsc --build` is what emits it.
      # `verify` gets this for free by running `pnpm typecheck` before `pnpm test`; a job
      # that runs the suite on its own has to ask for it.
      - run: pnpm typecheck
      - run: pnpm balance:sweep
        env:
          DUELBOX_BALANCE_TIER: ${{ matrix.tier }}
          DUELBOX_BALANCE_SEEDS: ${{ matrix.seeds }}

  allocation:
    name: rule 5, on a machine that is not doing anything else
    runs-on: ubuntu-latest
    # ## Why this is nightly and not on the push gate
    #
    # `packages/engine/src/allocation.test.ts` measures bytes allocated per call by reading
    # `used_heap_size` around a window of iterations. Every window is shared with whatever else
    # is running on the box: another worker's scavenge inside one makes it read low, another
    # worker's allocation makes it read high. On the four-core runner `verify` uses — two vitest
    # workers, three e2e shards beside them — the same unchanged case has been measured at
    # **0, 16, 32 and 40 bytes per call on consecutive runs**, and 40 is "an object" in that
    # file's own vocabulary.
    #
    # A retry over medians and a ceiling widened to one boxed double are both already in the
    # file, and neither was enough. Widening it further would stop it catching the objects,
    # arrays, closures and strings rule 5 is actually about, which is the whole of what it is
    # for.
    #
    # **The trade, stated rather than implied:** a per-frame allocation can now merge green and
    # is caught the next morning. That is worse than catching it at the gate. It is much better
    # than a gate that fails at random, because a gate that fails at random is one people learn
    # to re-run — and this repository keeps a tally of guards that stopped meaning anything.
    # The same argument, in the same words, is why `coverage` and the deep seat-balance sample
    # are here.
    #
    # One job, one worker, nothing beside it. `pnpm test:allocation` is the same command.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The engine's own `dist`, which the benchmark imports through the package name.
      - run: pnpm typecheck
      - run: pnpm test:allocation

  coverage:
    name: coverage thresholds
    runs-on: ubuntu-latest
    # Measured at 5m52s quiet and 9m49s on a busy twelve-core development machine, and the
    # seat-balance job's note above records that CI runs this kind of work four to five times
    # slower again. Ninety minutes is headroom, not an estimate; if a run ever approaches it
    # that is a finding, not a number to raise.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The registry loads every game from its `dist`, and `tsc --build` is what emits it.
      # `verify` gets this for free by running `pnpm typecheck` before `pnpm test`; a job
      # that runs the suite on its own has to ask for it.
      - run: pnpm typecheck
      # `test:coverage` sets DUELBOX_COVERAGE=1, which is what raises the test timeout. The
      # thresholds live in vitest.config.ts and fail this step on their own; there is no
      # separate check, and there must not be, or the number in the config and the number
      # that is enforced can drift apart.
      - run: pnpm test:coverage
      # Published whether or not the thresholds held. A report you can only see when the run
      # is green tells you nothing on the morning you need it: the failure message names the
      # axis that dropped, and this names the files.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  soak:
    name: memory soak, a hundred load-unload cycles
    runs-on: ubuntu-latest
    # Twelve seconds a test on a development machine, and the jobs above record that CI runs
    # this kind of work four to five times slower; the rest of the wall clock is install and
    # the build. Fifteen minutes is headroom rather than an estimate — a soak killed by its
    # own timeout reads as an infrastructure flake, which is exactly what `ci.yml` has been
    # bitten by twice.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The suite drives the real static artefact rather than a dev server, so what is
      # measured is what ships. This job runs alone and shares nothing with `all-engines`,
      # so it builds its own.
      - run: pnpm build
      # Chromium alone. The reading comes from the Chrome DevTools Protocol —
      # `HeapProfiler.collectGarbage` then `Runtime.getHeapUsage` — and no other engine
      # offers an honest one; the spec skips itself on WebKit rather than failing there.
      - run: npx playwright install --with-deps chromium
      # No `--` before the flags: pnpm 9 consumes that itself and they never reach Playwright,
      # which is the mistake `ci.yml` records against its shard flag. `--project=chromium`
      # because the `mobile` project is Chromium behind a phone viewport and would measure the
      # same teardown a second time. `DUELBOX_SOAK` is what un-skips the spec: without it the
      # soak is inert everywhere, which is how the push gate stays out of it.
      - run: pnpm e2e e2e/soak.spec.ts --project=chromium
        env:
          DUELBOX_SOAK: '1'
      # The numbers are printed by the spec on every run, pass or fail, so the log is the
      # record. The report is for the run where the trace matters.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: soak-report
          path: playwright-report/
          retention-days: 7
