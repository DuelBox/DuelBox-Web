<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DuelBox">
  <!-- The "maskable" purpose icon: the mark lives inside the safe zone (the centre ~40%
       radius a launcher may crop to), with the indigo bleeding to every edge so a circular or
       squircle mask never reveals a corner. The same mark as the others, scaled to 0.6 about
       the centre so it clears the crop. -->
  <rect x="0" y="0" width="64" height="64" fill="#4b3beb" />
  <g transform="translate(12.8 12.8) scale(0.6)">
    <path d="M46 12 18 52" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="23" cy="25" r="5.5" fill="#ffffff" />
    <rect x="36" y="34" width="10" height="10" rx="2.5" fill="#ffffff" />
  </g>
</svg>
