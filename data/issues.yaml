    - HTML never cached longer than 5 minutes
  labels: ["epic:perf", "epic:backend", "type:chore"]
  milestone: M3 Launch
  estimate: 5

- title: "Add route-level and game-level prefetching on intent"
  body: |
    **Acceptance**
    - Prefetch a game chunk on card hover or focus
    - Respects save-data and slow connections
  labels: ["epic:perf", "type:feat"]
  milestone: M3 Launch
  estimate: 5

- title: "Add battery and thermal awareness"
