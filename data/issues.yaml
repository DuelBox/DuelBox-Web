- title: "Eliminate per-frame allocations in the hot path"
  body: |
    GC pauses show up as stutter precisely during the busiest moments.
    **Acceptance**
    - Zero allocations per frame in engine update, verified by heap profiling
    - Vector/matrix operations use preallocated scratch objects
  labels: ["epic:perf", "epic:engine", "type:chore"]
  milestone: M2 Catalog
  estimate: 8

- title: "Implement adaptive quality scaling"
  body: |
    **Acceptance**
    - Particle count, DPR, and effect quality step down automatically when frame time exceeds budget
    - Never changes gameplay-relevant simulation
  labels: ["epic:perf", "type:feat"]
  milestone: M3 Launch
  estimate: 8

- title: "Add font loading optimisation"
  body: |
    **Acceptance**
