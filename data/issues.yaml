# =============== E12 MONETIZATION ===============
- title: "Decide and document the monetization model"
  body: |
    Options: display ads, rewarded video, premium ad-free unlock, cosmetic packs. Each has different consequences for latency, layout stability, and child-audience compliance.
    **Acceptance**
    - ADR with the chosen model and revenue-per-session estimates
    - Explicit decision on whether the site targets children, which constrains everything downstream
  labels: ["epic:monetization", "epic:legal", "type:spec"]
  milestone: M3 Launch
  estimate: 5

- title: "Implement ad slots that never cause layout shift"
  body: |
    Reserved fixed-height containers. An ad that reflows the page mid-match is the fastest way to lose a session.
    **Acceptance**
    - CLS contribution from ads is zero
