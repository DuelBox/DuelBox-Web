# DuelBox platform backlog.
# Game-specific issues are generated from data/games.yaml — do not duplicate them here.
# Each issue: title, body, labels, milestone, estimate (story points).

milestones:
  - name: M0 Foundation
    description: Repo, tooling, engine core, input system, game SDK. Nothing shippable yet.
  - name: M1 First Playable
    description: Shell + 6 launch games + tournament mode, playable end to end on mobile and desktop.
  - name: M2 Catalog
    description: Remaining games, AI opponents, audio, accessibility, i18n.
  - name: M3 Launch
    description: 3D landing site, SEO, analytics, monetization, legal, CI/CD, public release.
  - name: M4 Online
    description: Remote multiplayer, accounts, leaderboards, live ops.

labels:
  - {name: "epic:tooling",      color: "5319E7", description: "Repo, build, CI"}
  - {name: "epic:engine",       color: "0E8A16", description: "Core game engine"}
  - {name: "epic:input",        color: "0E8A16", description: "Two-player input system"}
  - {name: "epic:sdk",          color: "0E8A16", description: "Game module contract"}
  - {name: "epic:game",         color: "1D76DB", description: "Individual mini-game"}
  - {name: "epic:ui",           color: "D93F0B", description: "Shell UI and site design"}
  - {name: "epic:3d",           color: "D93F0B", description: "WebGL landing experience"}
  - {name: "epic:meta",         color: "FBCA04", description: "Tournament, progression, profiles"}
  - {name: "epic:audio",        color: "FBCA04", description: "Sound and music"}
  - {name: "epic:a11y",         color: "006B75", description: "Accessibility"}
  - {name: "epic:perf",         color: "006B75", description: "Performance budgets"}
  - {name: "epic:pwa",          color: "006B75", description: "Offline and installability"}
  - {name: "epic:backend",      color: "B60205", description: "Server, persistence, leaderboards"}
  - {name: "epic:analytics",    color: "B60205", description: "Telemetry and experimentation"}
  - {name: "epic:monetization", color: "B60205", description: "Ads, premium, IAP"}
  - {name: "epic:seo",          color: "C2E0C6", description: "Discovery and growth"}
  - {name: "epic:legal",        color: "C2E0C6", description: "Privacy, compliance, IP"}
  - {name: "epic:i18n",         color: "C2E0C6", description: "Localisation"}
  - {name: "epic:qa",           color: "BFDADC", description: "Testing"}
  - {name: "epic:online",       color: "5319E7", description: "Remote multiplayer"}
  - {name: "epic:docs",         color: "BFDADC", description: "Documentation"}
  - {name: "type:spec",         color: "EEEEEE", description: "Design or research, no shipping code"}
  - {name: "type:feat",         color: "EEEEEE", description: "New functionality"}
  - {name: "type:chore",        color: "EEEEEE", description: "Maintenance"}
  - {name: "type:bug",          color: "EEEEEE", description: "Defect"}
  - {name: "type:qa",           color: "EEEEEE", description: "Testing and verification work"}
  - {name: "good first issue",  color: "7057FF", description: "Small, self-contained"}
  - {name: "blocked",           color: "000000", description: "Waiting on a dependency"}
  - {name: "needs-design",      color: "F9D0C4", description: "Needs visual direction first"}
  - {name: "milestone-ready",   color: "2EA44F", description: "Groomed and ready for the build loop"}

issues:

# =============== E00 REPO & TOOLING ===============
- title: "Scaffold monorepo with pnpm workspaces"
  body: |
    Create the workspace layout the rest of the project assumes.
    Packages: `apps/web` (site + shell), `packages/engine`, `packages/game-sdk`, `packages/games/*`, `packages/ui`, `packages/analytics`.
    **Acceptance**
    - `pnpm i && pnpm build` succeeds from a clean clone
    - Each package has its own tsconfig extending a shared base
    - Root README documents the layout in under 30 lines
  labels: ["epic:tooling", "type:chore"]
  milestone: M0 Foundation
  estimate: 3

- title: "Add TypeScript strict config and shared tsconfig base"
  body: |
    `strict: true`, `noUncheckedIndexedAccess`, `exactOptionalPropertyTypes`. Game code touches arrays constantly; loose typing will cost more later.
    **Acceptance**
    - Zero `any` in `packages/engine`
    - `pnpm typecheck` runs across all packages
  labels: ["epic:tooling", "type:chore"]
  milestone: M0 Foundation
  estimate: 2

- title: "Set up Vite build with per-game code splitting"
  body: |
    Each game must be a separately-loadable chunk. A player opening Tic Tac Toe should not download the pool physics.
    **Acceptance**
    - Dynamic `import()` per game id
    - Initial JS payload under 150KB gzipped excluding any game
    - Build reports per-chunk sizes
  labels: ["epic:tooling", "epic:perf", "type:feat"]
  milestone: M0 Foundation
  estimate: 5

- title: "Add ESLint + Prettier + import ordering with a single `pnpm lint` entry point"
  body: |
    **Acceptance**
    - Lint fails CI on error, not warning
    - Format-on-save config committed for VS Code
  labels: ["epic:tooling", "type:chore", "good first issue"]
  milestone: M0 Foundation
  estimate: 1

- title: "Add Vitest with jsdom + canvas mock and a coverage gate"
  body: |
    Physics and rules code must be unit testable without a browser.
    **Acceptance**
    - `pnpm test` runs in under 30s
    - Coverage gate at 70% for `packages/engine` and any `rules.ts`
  labels: ["epic:tooling", "epic:qa", "type:chore"]
  milestone: M0 Foundation
  estimate: 3

- title: "Add Playwright for cross-browser smoke tests"
  body: |
    **Acceptance**
    - Runs Chromium, Firefox, WebKit
    - One test that loads the shell, starts a game, and asserts the canvas renders a non-blank frame
  labels: ["epic:tooling", "epic:qa", "type:chore"]
  milestone: M0 Foundation
  estimate: 3

- title: "Create issue and PR templates"
  body: |
    Issue templates: bug, new game, balance change. PR template with a checklist for tests, a11y, and bundle size.
    **Acceptance**
    - `.github/ISSUE_TEMPLATE/*.yml` present and rendering on GitHub
  labels: ["epic:tooling", "type:chore", "good first issue"]
  milestone: M0 Foundation
  estimate: 1

- title: "Add CODEOWNERS and branch protection"
  body: |
    **Acceptance**
    - `main` requires green CI and one approval
    - `packages/engine` requires a specific owner
  labels: ["epic:tooling", "type:chore", "good first issue"]
  milestone: M0 Foundation
  estimate: 1

- title: "Add a bundle-size budget check to CI"
  body: |
    Use `size-limit`. Regressions in payload size are the most likely silent quality loss on a games site.
    **Acceptance**
    - CI fails if shell JS exceeds 150KB gz or any single game exceeds 80KB gz
    - The failure comment shows the diff versus `main`
  labels: ["epic:tooling", "epic:perf", "type:chore"]
  milestone: M0 Foundation
  estimate: 3

- title: "Add Changesets for versioning game packages"
  body: |
    **Acceptance**
    - `pnpm changeset` works
    - Release PR is opened automatically
  labels: ["epic:tooling", "type:chore"]
  milestone: M3 Launch
  estimate: 2

- title: "Set up Storybook for `packages/ui`"
  body: |
    **Acceptance**
    - Every shared component has at least one story
    - Storybook deploys as a CI artefact preview
  labels: ["epic:tooling", "epic:ui", "type:chore"]
  milestone: M1 First Playable
  estimate: 3

- title: "Write CONTRIBUTING.md with the 'how to add a game' walkthrough"
  body: |
    **Acceptance**
    - A new contributor can add a working stub game in under 20 minutes following only this doc
  labels: ["epic:docs", "type:chore", "good first issue"]
  milestone: M1 First Playable
  estimate: 2

# =============== E01 ENGINE CORE ===============
- title: "Implement fixed-timestep game loop with interpolated rendering"
  body: |
    Physics at a fixed 60Hz accumulator, rendering decoupled and interpolated. Variable timestep will make every physics game feel different on different refresh rates — including 120Hz phones.
    **Acceptance**
    - Deterministic given identical input traces
    - Stable on 60Hz, 90Hz, 120Hz displays
    - Spiral-of-death guard caps catch-up steps
  labels: ["epic:engine", "type:feat"]
  milestone: M0 Foundation
  estimate: 8

- title: "Implement scene graph with transform hierarchy"
  body: |
    **Acceptance**
    - Parent/child transforms compose correctly
    - Dirty-flag propagation avoids recomputing static subtrees
  labels: ["epic:engine", "type:feat"]
  milestone: M0 Foundation
  estimate: 5

- title: "Build a 2D renderer abstraction over Canvas2D with a WebGL path"
  body: |
    Most games only need Canvas2D. A few (trails, particles) want WebGL. One interface, two backends, chosen per game.
    **Acceptance**
    - `Renderer` interface with sprite, shape, text, and line-batch primitives
    - Canvas2D backend complete; WebGL backend behind a flag
  labels: ["epic:engine", "type:feat"]
  milestone: M0 Foundation
  estimate: 13

- title: "Implement sprite atlas loader and texture packing at build time"
  body: |
    **Acceptance**
    - Atlases generated during build, not shipped as loose PNGs
    - Loader supports per-game atlas scoping
  labels: ["epic:engine", "epic:perf", "type:feat"]
  milestone: M1 First Playable
  estimate: 5

- title: "Implement 2D collision primitives: circle, AABB, OBB, segment"
  body: |
    **Acceptance**
    - Intersection + penetration depth + contact normal for every pair
    - Property-based tests verifying symmetry and no false negatives at touching distance
  labels: ["epic:engine", "type:feat"]
  milestone: M0 Foundation
  estimate: 8

- title: "Implement impulse-based collision resolution with restitution and friction"
  body: |
    Powers air hockey, sumo, spinner war, pin soccer, pool.
    **Acceptance**
    - Momentum conserved within float tolerance in a 1000-step soak test
    - No tunnelling at max game speed with CCD for fast small bodies
  labels: ["epic:engine", "type:feat"]
  milestone: M0 Foundation
  estimate: 13

- title: "Implement continuous collision detection for fast projectiles"
  body: |
    Bullets and pucks at high speed must not pass through thin walls between frames.
    **Acceptance**
    - Swept-circle against segment
    - Regression test firing a projectile at 5000 px/s at a 2px wall
  labels: ["epic:engine", "type:feat"]
  milestone: M0 Foundation
  estimate: 8

- title: "Implement spatial hash broadphase"
  body: |
    **Acceptance**
    - 200 bodies at 60fps on a 2019 mid-range Android device
    - Benchmarks committed
  labels: ["epic:engine", "epic:perf", "type:feat"]
  milestone: M1 First Playable
  estimate: 5

- title: "Implement seeded deterministic RNG"
  body: |
    Never use `Math.random()` in gameplay. Seeded RNG makes bugs reproducible and is a prerequisite for online play and replays.
    **Acceptance**
    - xorshift128 or PCG, serialisable state
    - Lint rule banning `Math.random` inside `packages/games/*`
  labels: ["epic:engine", "type:feat"]
  milestone: M0 Foundation
  estimate: 3

- title: "Implement particle system with pooling"
  body: |
    **Acceptance**
    - Zero allocations per frame in steady state
    - Emitter config is data, not code
  labels: ["epic:engine", "type:feat"]
  milestone: M2 Catalog
  estimate: 5

- title: "Implement tween/easing library for UI and game juice"
  body: |
    **Acceptance**
    - Standard easing set, chainable sequences, cancellation
    - All tweens respect `prefers-reduced-motion` globally
  labels: ["epic:engine", "epic:a11y", "type:feat"]
  milestone: M1 First Playable
  estimate: 3

- title: "Implement screen shake, hit-stop, and flash as reusable juice primitives"
  body: |
    These three effects account for most of the perceived quality gap between a prototype and a shipped mini-game. Build once, apply everywhere.
    **Acceptance**
    - Intensity is a single 0-1 parameter per effect
    - Fully disabled under reduced-motion, replaced by a non-motion feedback cue
  labels: ["epic:engine", "epic:a11y", "type:feat"]
  milestone: M1 First Playable
  estimate: 5

- title: "Implement asset preloader with progress events"
  body: |
    **Acceptance**
    - Reports 0-1 progress for the shell loading bar
    - Retries failed fetches twice with backoff
  labels: ["epic:engine", "type:feat"]
  milestone: M1 First Playable
  estimate: 3

- title: "Implement pause/resume/visibility handling"
  body: |
    Tab-switching mid-match must not fast-forward the accumulator.
    **Acceptance**
    - `visibilitychange` pauses the loop and clamps `dt` on resume
    - Audio suspends and resumes with the AudioContext
  labels: ["epic:engine", "type:feat"]
  milestone: M1 First Playable
  estimate: 3

- title: "Implement a debug overlay: FPS, step time, body count, input state"
  body: |
    **Acceptance**
    - Toggled by a query param, stripped from production bundles
  labels: ["epic:engine", "type:chore"]
  milestone: M0 Foundation
  estimate: 3

- title: "Implement input recording and replay for deterministic bug reports"
  body: |
    **Acceptance**
    - Record an input trace, replay it, get a byte-identical final state
    - Traces exportable as JSON from the debug overlay
  labels: ["epic:engine", "epic:qa", "type:feat"]
  milestone: M2 Catalog
  estimate: 8

- title: "Implement responsive canvas sizing with letterboxing and safe areas"
  body: |
    Games must render correctly from a 320px phone in portrait to a 4K desktop, including notch safe-area insets.
    **Acceptance**
    - Logical resolution fixed per game, scaled to fit
    - No gameplay element ever falls under a notch or home indicator
  labels: ["epic:engine", "epic:ui", "type:feat"]
  milestone: M0 Foundation
  estimate: 5

- title: "Add DPR-aware rendering with a cap"
  body: |
    Rendering at devicePixelRatio 3 on a phone destroys the frame budget for marginal visual gain.
    **Acceptance**
    - DPR capped at 2, configurable per game
    - Automatic downscale if frame time exceeds budget for 2 consecutive seconds
  labels: ["epic:engine", "epic:perf", "type:feat"]
  milestone: M2 Catalog
  estimate: 5

# =============== E02 TWO-PLAYER INPUT ===============
- title: "Design the multi-input abstraction covering touch, keyboard, and gamepad"
  body: |
    This is the single highest-risk piece of the project. Two humans, one browser tab, three input families, and no OS-level player separation.
    Write the design doc before any code: enumerate every layout (split touch zones, shared board tapping, keyboard halves, two gamepads) and how a game declares which it supports.
    **Acceptance**
    - Doc in `docs/input-design.md` with a decision table
    - Reviewed and approved before implementation issues start
  labels: ["epic:input", "type:spec"]
  milestone: M0 Foundation
  estimate: 5

- title: "Implement multi-touch tracking with per-player zone ownership"
  body: |
    A touch must be assigned to P1 or P2 on `touchstart` by which screen zone it began in, and keep that ownership until `touchend` even if the finger crosses the midline.
    **Acceptance**
    - Handles at least 10 simultaneous touch points
    - Finger crossing the seam does not steal the other player's control
    - Test with a synthetic multi-touch harness
  labels: ["epic:input", "type:feat"]
  milestone: M0 Foundation
  estimate: 13

- title: "Implement keyboard binding map with default P1/P2 split"
  body: |
    Default P1 = WASD + Space, P2 = Arrows + Enter. Both must work simultaneously.
    **Acceptance**
    - Simultaneous keydown from both halves registers independently
    - Ghosting-prone combos documented with a known-limitations note
  labels: ["epic:input", "type:feat"]
  milestone: M0 Foundation
  estimate: 5

- title: "Implement keyboard rebinding UI with conflict detection"
  body: |
    **Acceptance**
    - Cannot assign one key to both players
    - Bindings persist per browser profile
  labels: ["epic:input", "epic:ui", "type:feat"]
  milestone: M2 Catalog
  estimate: 5

- title: "Implement Gamepad API support with player-index assignment"
  body: |
    **Acceptance**
    - Two connected pads map to P1/P2 by connection order, reassignable
    - Deadzone and axis normalisation applied
    - Hot-plug and disconnect handled mid-match with a pause prompt
  labels: ["epic:input", "type:feat"]
  milestone: M2 Catalog
  estimate: 8

- title: "Implement input latency measurement harness"
  body: |
    Reaction games are unfair if one input path is slower than the other. Measure it rather than assume.
    **Acceptance**
    - Reports touch/keyboard/gamepad latency in the debug overlay
    - Documented baseline numbers per input family per browser
  labels: ["epic:input", "epic:qa", "type:feat"]
  milestone: M2 Catalog
  estimate: 5

- title: "Prevent browser default gestures that break gameplay"
  body: |
    Pull-to-refresh, double-tap zoom, long-press context menu, text selection, and iOS rubber-band scrolling all sabotage touch games.
    **Acceptance**
    - `touch-action: none` scoped to the canvas only
    - Verified on iOS Safari, Chrome Android, Samsung Internet
  labels: ["epic:input", "type:bug"]
  milestone: M1 First Playable
  estimate: 5

- title: "Implement rotate-device prompt for landscape-only games"
  body: |
    **Acceptance**
    - Non-blocking overlay, dismissible, does not pause a running match
    - Uses Screen Orientation API lock where permitted, falls back to the prompt
  labels: ["epic:input", "epic:ui", "type:feat"]
  milestone: M1 First Playable
  estimate: 3

- title: "Implement pass-and-play hand-off screen for hidden-information games"
  body: |
    Required by Sea Battle. A blackout screen with 'Pass to Player 2' and a confirm tap.
    **Acceptance**
    - No frame of the other player's state renders during the transition
    - Configurable per game via the SDK
  labels: ["epic:input", "epic:sdk", "type:feat"]
  milestone: M2 Catalog
  estimate: 5

- title: "Implement haptic feedback via the Vibration API with a global toggle"
  body: |
    **Acceptance**
    - Graceful no-op where unsupported (all iOS Safari)
    - Off by default on first visit, discoverable in settings
  labels: ["epic:input", "type:feat", "good first issue"]
  milestone: M2 Catalog
  estimate: 2

- title: "Handle simultaneous-input tie resolution policy"
  body: |
    In Quick Draw and Snake Clash two inputs can land in the same frame. Decide and document the rule once rather than per game.
    **Acceptance**
    - Policy documented: sub-frame timestamp ordering, tie declared a draw
    - Shared helper in the SDK
  labels: ["epic:input", "epic:sdk", "type:spec"]
  milestone: M1 First Playable
  estimate: 3

- title: "Add on-screen touch control hints that fade after first successful input"
  body: |
    **Acceptance**
    - Shown per game on first play only, resettable in settings
    - Do not obstruct any interactive area
  labels: ["epic:input", "epic:ui", "type:feat"]
  milestone: M2 Catalog
  estimate: 3

# =============== E03 GAME SDK ===============
- title: "Define the Game module contract"
  body: |
    Every game exports the same shape so the shell can load, run, pause, score, and unload it without knowing anything about it.
    Contract: `meta`, `init(ctx)`, `update(dt, input)`, `render(renderer, alpha)`, `onPause`, `onResume`, `destroy`, `getScore()`, `serialize()/deserialize()`.
    **Acceptance**
    - Typed interface in `packages/game-sdk`
    - A reference stub game implements it in under 60 lines
  labels: ["epic:sdk", "type:spec"]
  milestone: M0 Foundation
  estimate: 5

- title: "Define the GameMeta manifest schema"
  body: |
    Fields: id, name, genre, layout, minPlayers, supportsAI, orientation, estimatedRoundSeconds, controlScheme, thumbnail, colorPair, tags.
    **Acceptance**
    - Zod schema validating every game at build time
    - Build fails on a malformed manifest
  labels: ["epic:sdk", "type:feat"]
  milestone: M0 Foundation
  estimate: 3

- title: "Implement game lifecycle host in the shell"
  body: |
    **Acceptance**
    - Load, run, pause, resume, restart, quit, and unload with no memory growth across 50 load/unload cycles
    - Heap snapshot test in CI
  labels: ["epic:sdk", "epic:perf", "type:feat"]
  milestone: M1 First Playable
  estimate: 8

- title: "Implement the standard match flow: countdown, play, result, rematch"
  body: |
    Shared across all 44 games. Building it per game guarantees inconsistency.
    **Acceptance**
    - 3-2-1 countdown, in-match HUD, win banner, rematch and back-to-menu actions
    - Games only supply the win condition
  labels: ["epic:sdk", "type:feat"]
  milestone: M1 First Playable
  estimate: 8

- title: "Implement the shared scoreboard HUD component"
  body: |
    **Acceptance**
    - P1 and P2 scores anchored to their own screen halves and readable from arm's length
    - Colour-coded by the player colour pair, plus a shape/label so it is not colour-only
  labels: ["epic:sdk", "epic:ui", "epic:a11y", "type:feat"]
  milestone: M1 First Playable
  estimate: 5

- title: "Implement a difficulty interface for AI opponents"
  body: |
    Three tiers everywhere: Easy, Normal, Hard. Expressed as reaction delay, error magnitude, and blunder rate rather than cheating stats.
    **Acceptance**
    - Shared `AIDifficulty` type consumed by every game
    - Documented rule: AI never gets information or physics a human cannot get
  labels: ["epic:sdk", "type:spec"]
  milestone: M1 First Playable
  estimate: 5

- title: "Implement per-game settings persistence"
  body: |
    **Acceptance**
    - Namespaced storage keys, schema-versioned with a migration path
    - Corrupt data resets to defaults rather than crashing
  labels: ["epic:sdk", "type:feat"]
  milestone: M2 Catalog
  estimate: 3

- title: "Implement a game error boundary with recovery"
  body: |
    One game throwing must not take down the shell.
    **Acceptance**
    - Caught error shows a recoverable screen and reports to error tracking
    - Player returns to the menu with tournament progress intact
  labels: ["epic:sdk", "type:feat"]
  milestone: M1 First Playable
  estimate: 5

- title: "Create a `create-game` CLI scaffold"
  body: |
    **Acceptance**
    - `pnpm create-game <id>` produces a compiling, runnable stub registered in the catalog
  labels: ["epic:sdk", "epic:tooling", "type:feat"]
  milestone: M0 Foundation
  estimate: 5

- title: "Implement a headless simulation harness for balance testing"
  body: |
    Run AI vs AI for 10,000 matches without rendering to find degenerate strategies and win-rate skew.
    **Acceptance**
    - Reports win rate, average round length, and stalemate rate per game
    - Runs in CI nightly and flags any game outside a 45-55% first-player win band
  labels: ["epic:sdk", "epic:qa", "type:feat"]
  milestone: M2 Catalog
  estimate: 8

- title: "Implement game asset licensing manifest"
  body: |
    Every sprite, font, and sound file records its source and licence. This is what makes a takedown claim answerable.
    **Acceptance**
    - `assets.license.json` per game, validated in CI
    - Build fails on an asset with no licence entry
  labels: ["epic:sdk", "epic:legal", "type:feat"]
  milestone: M1 First Playable
  estimate: 5

- title: "Implement a spectator/idle attract mode"
  body: |
    AI vs AI plays on the menu background when idle. Cheap, and it demonstrates games to a first-time visitor.
    **Acceptance**
    - Starts after 20s idle, stops instantly on any input
    - Capped frame rate to protect battery
  labels: ["epic:sdk", "epic:ui", "type:feat"]
  milestone: M3 Launch
  estimate: 5

# =============== E04 UI / SHELL / DESIGN ===============
- title: "Produce the design system: palette, type scale, spacing, motion tokens"
  body: |
    Direction is 'the seam' — the whole product identity is one diagonal split dividing P1 and P2 territory, carried from the landing hero into the game HUDs.
    Palette: `--ink #08090F`, `--surface #12141F`, `--p1 #FF3B6B`, `--p2 #21E6C1`, `--gold #FFC94A`, `--paper #E8E6DF`.
    Type: display Archivo Expanded, body Inter Tight, data/scoreboard JetBrains Mono.
    **Acceptance**
    - Tokens as CSS custom properties, single source of truth
    - No component hardcodes a hex value
  labels: ["epic:ui", "type:spec", "needs-design"]
  milestone: M0 Foundation
  estimate: 8

- title: "Build the shared component library: Button, Card, Modal, Toggle, Slider, Tabs"
  body: |
    **Acceptance**
    - Keyboard operable, visible focus rings, ARIA roles correct
    - Storybook story per component per state
  labels: ["epic:ui", "epic:a11y", "type:feat"]
  milestone: M1 First Playable
  estimate: 8

- title: "Build the game catalog grid with genre filtering and search"
  body: |
    **Acceptance**
    - Filter by genre, player count, and round length
    - Search matches name and tags, debounced, no layout shift
    - Works with keyboard alone
  labels: ["epic:ui", "type:feat"]
  milestone: M1 First Playable
  estimate: 8

- title: "Design and build the game card with animated preview"
  body: |
    Static thumbnails undersell action games. A short looping preview on hover/focus converts far better.
    **Acceptance**
    - Preview is a lightweight looping asset, lazy-loaded, under 60KB
    - Falls back to a static frame under reduced-motion or save-data
  labels: ["epic:ui", "epic:perf", "type:feat"]
  milestone: M2 Catalog
  estimate: 5

- title: "Build the pre-game lobby: mode select, difficulty, controls preview, start"
  body: |
    **Acceptance**
    - Shows the control scheme for the detected input device before the match
    - Two-player vs one-player-vs-AI toggle
  labels: ["epic:ui", "type:feat"]
  milestone: M1 First Playable
  estimate: 5

- title: "Build the pause menu and quit-confirm flow"
  body: |
    **Acceptance**
