  labels: ["epic:3d", "epic:perf", "type:chore"]
  milestone: M3 Launch
  estimate: 8

- title: "Add WebGL context-loss recovery"
  body: |
    Mobile browsers drop GL contexts under memory pressure. Unhandled, the hero becomes a black rectangle.
    **Acceptance**
    - `webglcontextlost` handled, scene rebuilt on restore
    - Falls back permanently to the static hero after two losses
  labels: ["epic:3d", "type:bug"]
  milestone: M3 Launch
  estimate: 5

- title: "Implement scroll-triggered reveal animations for landing sections"
  body: |
    **Acceptance**
    - IntersectionObserver based, no scroll listeners
    - All disabled under reduced-motion with content immediately visible
  labels: ["epic:3d", "epic:a11y", "type:feat"]
  milestone: M3 Launch
  estimate: 5

- title: "Ensure the landing page is fully functional with JavaScript disabled"
  body: |
    Search crawlers and a meaningful slice of users. Content, links, and game descriptions must be in the server-rendered HTML.
    **Acceptance**
    - Full content and navigation present in view-source
    - Lighthouse SEO score 100 with JS disabled
  labels: ["epic:3d", "epic:seo", "epic:a11y", "type:feat"]
  milestone: M3 Launch
  estimate: 5

