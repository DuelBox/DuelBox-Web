  milestone: M3 Launch
  estimate: 5

- title: "Set up real-device testing on low-end Android"
  body: |
    Emulators do not surface thermal throttling or GPU limits. Test on real hardware in the sub-$150 bracket, which is a large share of the audience.
    **Acceptance**
