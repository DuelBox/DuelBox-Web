# =============== E04b 3D LANDING EXPERIENCE ===============
- title: "Spec the 3D landing experience and its performance budget"
  body: |
    The reference sites (Apple product pages, WebGL portfolios) are desktop-first showcases. A games site is majority mobile. Decide up front what mobile gets.
    **Acceptance**
    - Doc naming the exact scroll beats and what each communicates
    - Hard budget: under 2.5s LCP on a mid-range Android over 4G
    - Explicit mobile fallback plan
  labels: ["epic:3d", "type:spec", "needs-design"]
  milestone: M3 Launch
  estimate: 5

- title: "Implement the WebGL hero scene with React Three Fiber"
  body: |
    Concept: an arcade cabinet split along the seam, each half lit in the P1/P2 colour, rotating to reveal live game footage on the screen.
    **Acceptance**
    - Loads under 400KB including geometry and textures
    - Holds 60fps on desktop, 30fps floor on mid-range mobile
  labels: ["epic:3d", "type:feat"]
  milestone: M3 Launch
  estimate: 13

- title: "Implement scroll-driven camera choreography"
  body: |
    **Acceptance**
    - Scroll position drives camera along a fixed spline, no scroll-jacking
    - Native scroll speed preserved; page fully usable with scrollbar dragging
  labels: ["epic:3d", "type:feat"]
  milestone: M3 Launch
  estimate: 8

- title: "Implement a static fallback hero for low-end devices and reduced-motion"
  body: |
    Detect via `navigator.hardwareConcurrency`, `deviceMemory`, save-data, and reduced-motion. Serve a designed static composition, not a broken 3D scene.
    **Acceptance**
    - Fallback is a deliberate design, not a screenshot
    - Zero WebGL code downloaded when the fallback triggers
  labels: ["epic:3d", "epic:perf", "epic:a11y", "type:feat"]
  milestone: M3 Launch
  estimate: 8

- title: "Optimise 3D assets: Draco compression, KTX2 textures, LOD"
  body: |
    **Acceptance**
    - Geometry Draco-compressed, textures KTX2/Basis
