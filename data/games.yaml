# DuelBox game catalog
# 44 original two-player-one-screen mini-games.
# Genres are unprotectable; all art, audio, code and names here must be original.
# Trademarked names deliberately avoided (Drop Four, Reversi, Sea Battle, Light Trails).
#
# fields:
#   id         slug used for folder + issue prefix
#   name       display name
#   genre      grouping for the site nav
#   layout     how the screen is divided between P1 and P2
#   controls   input model per player
#   loop       the 15-second explanation of the core loop
#   sim        the hard part of the simulation
#   ai         what the CPU opponent has to do
#   round      target round length
#   build      S | M | L  (relative implementation cost)

games:

  # ---------- PADDLE & PUCK ----------
  - id: ping-pong
    name: Ping Pong
    genre: Paddle & Puck
    layout: mirrored-halves-vertical
    controls: 1-axis paddle (drag / W-S / Up-Down)
    loop: Return the ball past your opponent's paddle. First to 7.
    sim: Deterministic ball-paddle reflection with spin from paddle velocity; speed ramp per rally.
    ai: Track ball y with reaction delay + aim error, scaled by difficulty.
    round: 60-90s
    build: S

  - id: air-hockey
    name: Air Hockey
    genre: Paddle & Puck
    layout: mirrored-halves-vertical
    controls: 2-axis mallet constrained to own half
    loop: Slap the puck into your opponent's goal. First to 7.
    sim: Circle-circle impulse collision, wall restitution, mallet carries momentum into puck, puck friction.
    ai: Intercept-point prediction, defend goal line when puck incoming, strike when puck in own half.
    round: 60-90s
    build: M

  - id: volley-duel
    name: Volley Duel
    genre: Paddle & Puck
    layout: mirrored-halves-horizontal
    controls: move + jump (2 keys / 2 touch zones)
    loop: Keep the ball off your own ground. Point when it lands on their side.
    sim: Gravity + bounce, character-ball collision with directional launch, net collision.
    ai: Predict landing point, decide jump timing window.
    round: 60s
    build: M

  - id: brick-duel
    name: Brick Duel
    genre: Paddle & Puck
    layout: mirrored-halves-vertical
    controls: 1-axis paddle
    loop: Break through the centre wall and land the ball in their zone.
    sim: Brick grid collision, shared centre wall regenerating, ball speed ramp.
    ai: Paddle tracking + occasional deliberate angle shots.
    round: 90s
    build: M

  - id: tennis-rally
    name: Tennis Rally
    genre: Paddle & Puck
    layout: mirrored-halves-horizontal
    controls: move + swing (timed)
    loop: Timed swings send the ball deep or short. Miss and they score.
    sim: Swing timing window maps to shot power/angle; bounce before return required.
    ai: Move to predicted bounce, swing inside timing window with difficulty-scaled jitter.
    round: 90s
    build: M

  # ---------- ARENA PHYSICS ----------
  - id: sumo-push
    name: Sumo Push
    genre: Arena Physics
    layout: shared-arena
    controls: 2-axis move, momentum-based
    loop: Shove your opponent off the circular platform.
    sim: Mass, acceleration, restitution on body collision, ring-out detection, shrinking ring timer.
    ai: Steer toward opponent, back off when near edge, charge when opponent is edge-adjacent.
    round: 20-40s
    build: M

  - id: spinner-war
    name: Spinner War
    genre: Arena Physics
    layout: shared-arena
    controls: thrust in facing direction (1 button + steer)
    loop: Spinning tops collide; last one on the stage wins.
    sim: Angular momentum, spin decay, collision impulse proportional to relative spin.
    ai: Charge when spin advantage, evade when spin low.
    round: 20-40s
    build: M

  - id: chicken-fight
    name: Chicken Fight
    genre: Arena Physics
    layout: shared-arena
    controls: hop + peck (2 buttons)
    loop: Knock the other bird off the perch with well-timed hops.
    sim: Ragdoll-lite two-segment body, hop impulse, peck hitbox with knockback.
    ai: Timed hop-in, retreat cadence.
    round: 20-40s
    build: M

  - id: sword-clash
    name: Sword Clash
    genre: Arena Physics
    layout: shared-arena
    controls: move + attack + guard (3 inputs)
    loop: Land a hit while they're unguarded. Three hits wins.
    sim: Attack/guard state machine, hitbox-hurtbox overlap, parry window, knockback.
    ai: State-machine with aggression parameter and reaction delay.
    round: 30-45s
    build: L

  - id: tug-of-war
    name: Tug of War
    genre: Arena Physics
    layout: mirrored-halves-vertical
    controls: alternating-tap rhythm
    loop: Tap in rhythm to drag the rope marker into your zone.
    sim: Force accumulation with stamina decay; mistimed taps cost force.
    ai: Tap cadence with drift and stamina model.
    round: 20-30s
    build: S

  - id: balance-beam
    name: Balance Beam
    genre: Arena Physics
    layout: shared-arena
    controls: lean left / lean right
    loop: Stay upright on the tilting beam longer than they do.
    sim: Inverted-pendulum stability, shared platform torque coupling both players.
    ai: PD controller with noise injection.
    round: 20-40s
    build: M

  - id: rope-cut
    name: Rope Cut
    genre: Arena Physics
    layout: shared-arena
    controls: aim + cut
    loop: Cut the rope so the weight swings into their side.
    sim: Verlet rope constraint solver, pendulum swing, weight collision.
    ai: Evaluate swing outcome over a few candidate cut points.
    round: 30s
    build: L

  # ---------- SHOOTERS & ARTILLERY ----------
  - id: tank-duel
    name: Tank Duel
    genre: Shooters
    layout: shared-arena
    controls: drive + rotate turret + fire
    loop: Ricochet shells off walls into their tank.
    sim: Shell reflection off walls with bounce budget, reload cooldown, destructible cover.
    ai: Raycast bounce solver to find a firing solution.
    round: 45-60s
    build: L

  - id: hill-artillery
    name: Hill Artillery
    genre: Shooters
    layout: mirrored-halves-horizontal
    controls: angle + power (charge-and-release)
    loop: Lob a shot over the hill onto their position. Wind changes each turn.
    sim: Projectile ballistics with wind, destructible terrain heightmap.
    ai: Solve angle/power from ballistic equation, add error by difficulty.
    round: 45-90s
    build: L

  - id: space-duel
    name: Space Duel
    genre: Shooters
    layout: shared-arena
    controls: rotate + thrust + fire
    loop: Zero-gravity dogfight with screen wrap. Three hits wins.
    sim: Newtonian drift, screen wrapping, bullet lifetime, optional central gravity well.
    ai: Lead-target aiming, thrust management, wrap-aware pathing.
    round: 45-60s
    build: L

  - id: archer-arc
    name: Archer Arc
    genre: Shooters
    layout: mirrored-halves-horizontal
    controls: draw-and-release (angle from drag vector)
    loop: Arc an arrow across the gap and hit them.
    sim: Drag-vector to velocity mapping, gravity, arrow rotation to velocity, hit zones.
    ai: Ballistic solve with error cone.
    round: 30-45s
    build: M

  - id: cannon-standoff
    name: Cannon Standoff
    genre: Shooters
    layout: mirrored-halves-vertical
    controls: move + fire
    loop: Dodge incoming fire while landing your own. Real-time, no turns.
    sim: Bullet pooling, dodge windows, cooldown balance to prevent stalemate.
    ai: Dodge-then-punish cycle.
    round: 45s
    build: M

  # ---------- RACING & TRAILS ----------
  - id: light-trails
    name: Light Trails
    genre: Racing & Trails
    layout: shared-arena
    controls: turn left / turn right only
    loop: Leave a solid trail behind you. Make them crash first.
    sim: Grid or continuous trail collision, trail memory, speed ramp.
    ai: Flood-fill open-space evaluation to avoid enclosure.
    round: 20-40s
    build: M

  - id: curve-duel
    name: Curve Duel
    genre: Racing & Trails
    layout: shared-arena
    controls: hold-to-turn (analog curve)
    loop: Continuous curving trail with random gaps. Survive longest.
    sim: Continuous-curve trail with periodic gap holes, sub-pixel collision sampling.
    ai: Lookahead raycast steering.
    round: 20-40s
    build: M

  - id: snake-clash
    name: Snake Clash
    genre: Racing & Trails
    layout: shared-arena
    controls: 4-direction
    loop: Eat to grow, don't hit their tail or yours.
    sim: Grid tick loop, growth queue, simultaneous-move tie resolution.
    ai: A* to nearest food with self-trap avoidance.
    round: 45-60s
    build: M

  - id: top-down-race
    name: Top-Down Race
    genre: Racing & Trails
    layout: shared-arena
    controls: accelerate + steer + brake
    loop: Three laps around a tight circuit. Contact is allowed.
    sim: Arcade car handling with lateral grip, lap/checkpoint validation, car-car collision.
    ai: Racing-line follower with rubber-banding.
    round: 60-90s
    build: L

  - id: hill-climb-duel
    name: Hill Climb Duel
    genre: Racing & Trails
    layout: split-screen-stacked
    controls: gas + brake (tilt control)
    loop: Two bikes, one hilly track. Don't flip. Reach the flag first.
    sim: 2-wheel suspension physics on a terrain spline, rider flip detection.
    ai: Throttle policy tuned per terrain slope.
    round: 60-90s
    build: L

  - id: rocket-landing
    name: Rocket Landing
    genre: Racing & Trails
    layout: split-screen-side
    controls: thrust + rotate
    loop: Land softly on the pad. Fuel is limited. Cleanest landing wins.
    sim: Thrust vectoring, fuel drain, landing velocity/angle tolerance scoring.
    ai: PD-controlled descent.
    round: 30-45s
    build: M

  # ---------- SPORTS ----------
  - id: penalty-kicks
    name: Penalty Kicks
    genre: Sports
    layout: alternating-turns
    controls: drag-to-aim shot / drag-to-dive save
    loop: Alternate shooting and keeping. Best of five.
    sim: Curved shot trajectory from swipe arc, keeper dive reach envelope.
    ai: Shot placement distribution + dive read with difficulty-scaled accuracy.
    round: 60-90s
    build: M

  - id: basketball-1v1
    name: Basketball 1v1
    genre: Sports
    layout: mirrored-halves-vertical
    controls: charge-and-release arc shot
    loop: Race to sink more shots in 60 seconds. Blocked rims are shared.
    sim: Arc trajectory, rim and backboard collision, swish detection.
    ai: Arc solver with power jitter.
    round: 60s
    build: M

  - id: pin-soccer
    name: Pin Soccer
    genre: Sports
    layout: shared-arena
    controls: flick a disc (drag-and-release)
    loop: Flick your discs to knock the ball into their goal.
    sim: Disc-disc and disc-ball impulse, friction decay, turn ownership.
    ai: Evaluate a set of candidate flicks and score them.
    round: 90s
    build: L

  - id: pool-duel
    name: Pool Duel
    genre: Sports
    layout: alternating-turns
    controls: aim line + power
    loop: Alternate shots. Sink your set, then the black.
    sim: Elastic ball-ball collision, cushion rebound, spin optional, pocket detection, foul rules.
    ai: Shot search over aim/power grid with pocket scoring.
    round: 120s+
    build: L

  - id: mini-golf
    name: Mini Golf
    genre: Sports
    layout: alternating-turns
    controls: drag-and-release putt
    loop: Same hole, fewest strokes. Nine holes.
    sim: Rolling friction, slope forces, wall bounce, obstacle triggers.
    ai: Putt search with error.
    round: 120s+
    build: L

  - id: bowling-alley
    name: Bowling Alley
    genre: Sports
    layout: alternating-turns
    controls: aim + spin + power
    loop: Ten frames each. Strikes and spares count.
    sim: Pin-pin chain collision, lane spin curve, scoring rules with bonus frames.
    ai: Aim/spin selection with jitter.
    round: 120s+
    build: L

  - id: foosball
    name: Foosball
    genre: Sports
    layout: mirrored-halves-vertical
    controls: slide rod + spin rod
    loop: Control rows of figures. Score in their goal.
    sim: Rod-constrained figures, kick impulse from rod rotation, ball trapping.
    ai: Rod positioning heuristic + kick trigger.
    round: 90s
    build: L

  - id: curling-slide
    name: Curling Slide
    genre: Sports
    layout: alternating-turns
    controls: aim + power + curl
    loop: Slide stones closest to the centre. Knock theirs out.
    sim: Ice friction, curl drift, stone-stone collision, house scoring.
    ai: Shot selection between draw and takeout.
    round: 90s
    build: M

  # ---------- BOARD & STRATEGY ----------
  - id: tic-tac-toe
    name: Tic Tac Toe
    genre: Board & Strategy
    layout: shared-board
    controls: tap cell
    loop: Three in a row. Rotate who starts.
    sim: 3x3 state, win/draw detection.
    ai: Full minimax (trivially solvable) with difficulty via deliberate blunder rate.
    round: 20s
    build: S

  - id: drop-four
    name: Drop Four
    genre: Board & Strategy
    layout: shared-board
    controls: tap column
    loop: Drop discs into a 7x6 grid. Four in a row wins.
    sim: Gravity fill, 4-direction win scan, full-board draw.
    ai: Minimax with alpha-beta, depth by difficulty.
    round: 60s
    build: M

  - id: gomoku
    name: Gomoku
    genre: Board & Strategy
    layout: shared-board
    controls: tap intersection
    loop: Five in a row on a 15x15 board.
    sim: Large-board win scan, overline rules.
    ai: Threat-space search with pattern scoring.
    round: 90s
    build: M

  - id: checkers
    name: Checkers
    genre: Board & Strategy
    layout: shared-board
    controls: tap-select + tap-target
    loop: Jump their pieces. Kings move both ways.
    sim: Forced-capture rules, multi-jump chains, promotion.
    ai: Minimax with material + mobility eval.
    round: 120s+
    build: L

  - id: chess-lite
    name: Chess
    genre: Board & Strategy
    layout: shared-board
    controls: tap-select + tap-target
    loop: Full rules, shared board, flip-for-black option.
    sim: Legal move generation, castling, en passant, promotion, check/stalemate/repetition.
    ai: Wrap a proven open-source engine; do not hand-roll.
    round: 300s+
    build: L

  - id: reversi
    name: Reversi
    genre: Board & Strategy
    layout: shared-board
    controls: tap cell
    loop: Flip their discs by flanking. Most discs at the end wins.
    sim: 8-direction flip resolution, legal-move highlighting, pass handling.
    ai: Minimax with corner/mobility weighting.
    round: 120s
    build: M

  - id: dots-and-boxes
    name: Dots and Boxes
    genre: Board & Strategy
    layout: shared-board
    controls: tap edge
    loop: Claim edges. Complete a box, go again.
    sim: Edge graph, box completion, chain scoring, extra-turn rule.
    ai: Chain-length aware heuristic.
    round: 90s
    build: M

  - id: sea-battle
    name: Sea Battle
    genre: Board & Strategy
    layout: pass-and-play-hidden
    controls: tap grid + hand-off screen between turns
    loop: Place your fleet, then hunt theirs. Hidden information on one device.
    sim: Placement validation, hit/miss/sunk, mandatory hand-off blackout screen.
    ai: Hunt/target algorithm with parity search.
    round: 180s+
    build: L

  - id: nim-stacks
    name: Nim Stacks
    genre: Board & Strategy
    layout: shared-board
    controls: tap to remove
    loop: Take any number from one stack. Take the last piece and lose.
    sim: Misere Nim rules, nim-sum evaluation.
    ai: Perfect play via nim-sum, blunder rate by difficulty.
    round: 30s
    build: S

  - id: mancala-pits
    name: Mancala Pits
    genre: Board & Strategy
    layout: shared-board
    controls: tap pit
    loop: Sow seeds around the board and capture into your store.
    sim: Sowing loop, capture rule, extra-turn rule, end-of-game sweep.
    ai: Minimax over sow outcomes.
    round: 120s
    build: M

  # ---------- REACTION & PARTY ----------
  - id: quick-draw
    name: Quick Draw
    genre: Reaction & Party
    layout: mirrored-halves-vertical
    controls: single tap
    loop: Wait for the signal. Tap first. Tap early and you lose the round.
    sim: Randomised delay, false-start detection, sub-frame input timestamping.
    ai: Sampled human reaction distribution by difficulty.
    round: 15s
    build: S

  - id: colour-trap
    name: Colour Trap
    genre: Reaction & Party
    layout: mirrored-halves-vertical
    controls: 4 colour buttons
    loop: Tap the colour of the word, not the word itself. Fastest streak wins.
    sim: Stroop-style prompt generator, per-player streak and penalty timing.
    ai: Reaction distribution + error rate.
    round: 30-45s
    build: S

  - id: math-duel
    name: Math Duel
    genre: Reaction & Party
    layout: mirrored-halves-vertical
    controls: multiple-choice tap
    loop: Answer faster than them. Difficulty scales as you win.
    sim: Question generator with tiered difficulty, adaptive ramp.
    ai: Solve time distribution + wrong-answer rate.
    round: 45s
    build: S

  - id: memory-match
    name: Memory Match
    genre: Reaction & Party
    layout: shared-board
    controls: tap card
    loop: Flip pairs. Match and go again. Most pairs wins.
    sim: Shuffle, flip animation queue, match/extra-turn rule.
    ai: Imperfect memory model — remembers N recent cards by difficulty.
    round: 90s
    build: S

  - id: hold-the-line
    name: Hold the Line
    genre: Reaction & Party
    layout: mirrored-halves-vertical
    controls: press and hold
    loop: Hold exactly as long as the target. Closest wins. No timer shown.
    sim: Hold-duration capture, target randomisation, scoring by absolute error.
    ai: Target estimate with gaussian error.
    round: 20s
    build: S
