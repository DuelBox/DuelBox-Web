# DuelBox catalog — derived from the observed reference-app grid (docs/reference-analysis.md).
# Rules and mechanics are reimplemented from scratch; names marked `rename: true` are
# changed on our side because the original is trademark-risky or app-specific.
#
# archetype drives which sub-issue template set a game gets:
#   turn-board  alternating turns on a shared board, 180deg seat rotation
#   turn-aim    alternating turns, drag-to-aim physics shot
#   rt-split    real-time, both players act at once, screen split into two seats
#   rt-arena    real-time, both players share one arena/playfield
#   rt-race     real-time driving/running with a track or scrolling course
#
# confidence:
#   observed  mechanics seen directly this session
#   genre     name + card art make the genre unambiguous (chess, bowling, darts...)
#   research  must be played and documented before its spec issue can close

games:

