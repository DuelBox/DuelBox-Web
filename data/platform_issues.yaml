# Website + platform backlog. Granular by design: every issue is one focused change
# a single PR can close, sized roughly 30 minutes to 4 hours.
#
# Stack decision (recorded in E01):
#   Next.js 15 App Router + TypeScript strict  — SSG/SSR is non-negotiable for a games
#     portal's organic traffic, and the App Router gives per-game route code splitting.
#   Tailwind CSS v4 + CSS custom-property tokens — one token source for shell and canvas.
#   Custom Canvas2D engine, fixed timestep, zero React inside the game loop.
#   React Three Fiber + drei for the landing hero ONLY, never loaded on a game route.
#   Zustand for shell state, Vitest + Playwright for tests, pnpm workspaces, Vercel edge.

milestones:
  - {name: "M0 Foundation",     description: "Repo, tooling, CI, design tokens, engine core, input. Nothing shippable yet."}
  - {name: "M1 Playable Shell", description: "Shell routes, game host, match flow, HUD, first playable games."}
  - {name: "M2 Game Catalog",   description: "The full game library, bots, audio, per-game polish."}
  - {name: "M3 Premium Site",   description: "3D landing, motion system, SEO, PWA, analytics, launch readiness."}
  - {name: "M4 Online",         description: "Remote multiplayer, accounts, leaderboards, live ops."}

labels:
  - {name: "epic:setup",        color: "5319E7", description: "Repo, build, tooling, CI/CD"}
  - {name: "epic:design",       color: "D93F0B", description: "Design system and visual language"}
  - {name: "epic:3d",           color: "D93F0B", description: "WebGL / Three.js landing experience"}
  - {name: "epic:site",         color: "D93F0B", description: "Website shell, routes, navigation"}
  - {name: "epic:engine",       color: "0E8A16", description: "Game engine core"}
  - {name: "epic:input",        color: "0E8A16", description: "Two-player input system"}
  - {name: "epic:sdk",          color: "0E8A16", description: "Game contract and match flow"}
  - {name: "epic:game",         color: "1D76DB", description: "An individual mini-game"}
  - {name: "epic:audio",        color: "FBCA04", description: "Sound and music"}
  - {name: "epic:meta",         color: "FBCA04", description: "Tournament, progression, profiles"}
  - {name: "epic:a11y",         color: "006B75", description: "Accessibility"}
  - {name: "epic:perf",         color: "006B75", description: "Performance budgets"}
  - {name: "epic:pwa",          color: "006B75", description: "Offline and installability"}
  - {name: "epic:seo",          color: "C2E0C6", description: "Discovery and growth"}
  - {name: "epic:backend",      color: "B60205", description: "Server, persistence, APIs"}
  - {name: "epic:analytics",    color: "B60205", description: "Telemetry and experimentation"}
  - {name: "epic:legal",        color: "C2E0C6", description: "Privacy, compliance, IP"}
  - {name: "epic:i18n",         color: "C2E0C6", description: "Localisation"}
  - {name: "epic:qa",           color: "BFDADC", description: "Testing and verification"}
  - {name: "epic:online",       color: "5319E7", description: "Remote multiplayer"}
  - {name: "epic:docs",         color: "BFDADC", description: "Documentation"}
  - {name: "type:epic",         color: "EEEEEE", description: "Parent issue tracking a group of work"}
  - {name: "type:research",     color: "EEEEEE", description: "Play, observe, document. No shipping code"}
  - {name: "type:spec",         color: "EEEEEE", description: "Design or architecture decision"}
  - {name: "type:feat",         color: "EEEEEE", description: "New functionality"}
  - {name: "type:chore",        color: "EEEEEE", description: "Maintenance"}
  - {name: "type:bug",          color: "EEEEEE", description: "Defect"}
  - {name: "type:qa",           color: "EEEEEE", description: "Verification work"}
  - {name: "priority:P0",       color: "B60205", description: "Blocks everything else"}
  - {name: "priority:P1",       color: "D93F0B", description: "Needed for the milestone"}
  - {name: "priority:P2",       color: "FBCA04", description: "Valuable, not blocking"}
  - {name: "priority:P3",       color: "C5DEF5", description: "Nice to have"}
  - {name: "size:XS",           color: "EEEEEE", description: "Under 1 hour"}
  - {name: "size:S",            color: "EEEEEE", description: "1-2 hours"}
  - {name: "size:M",            color: "EEEEEE", description: "2-4 hours"}
  - {name: "size:L",            color: "EEEEEE", description: "Over 4 hours - consider splitting"}
  - {name: "good first issue",  color: "7057FF", description: "Small and self-contained"}
  - {name: "blocked",           color: "000000", description: "Waiting on a dependency"}
  - {name: "needs-design",      color: "F9D0C4", description: "Needs visual direction first"}
  - {name: "ready",             color: "2EA44F", description: "Groomed, unblocked, safe to start"}

# =====================================================================
# Each entry: title, why, actions[], acceptance[], labels, milestone, size
# The seeder renders these into a consistent issue body.
# =====================================================================
issues:

# ---------- E00 REPO & TOOLING ----------
- title: "Initialise Next.js 15 app with TypeScript and the App Router"
  epic: setup
  why: "Everything else needs a compiling app to land in. The repo is currently an empty skeleton with only a README."
  actions: ["Create apps/web with create-next-app, App Router, TypeScript, no example boilerplate", "Set React strict mode", "Delete all starter placeholder pages and styles"]
  acceptance: ["pnpm dev serves a blank themed page at /", "pnpm build succeeds from a clean clone", "No starter template files remain"]
  labels: ["epic:setup", "type:chore", "priority:P0", "size:S"]
  milestone: M0 Foundation

- title: "Convert the repo to a pnpm workspace monorepo"
  epic: setup
  why: "The engine, SDK, UI kit, and 99 game packages must version and build independently, and each game must be its own lazily loaded chunk."
  actions: ["Add pnpm-workspace.yaml covering apps/* and packages/*", "Create packages/engine, packages/game-sdk, packages/ui, packages/games", "Add a root package.json with shared scripts"]
  acceptance: ["pnpm -r build runs across every package", "Cross-package imports resolve by workspace name, not relative path"]
  labels: ["epic:setup", "type:chore", "priority:P0", "size:S"]
  milestone: M0 Foundation

- title: "Add a shared strict tsconfig base and per-package configs"
  epic: setup
  why: "Physics and rules code indexes arrays constantly; loose typing turns that into runtime bugs nobody catches in review."
  actions: ["tsconfig.base.json with strict, noUncheckedIndexedAccess, exactOptionalPropertyTypes, noImplicitOverride", "Each package extends it", "Add pnpm typecheck"]
  acceptance: ["pnpm typecheck passes across all packages", "Zero uses of any in packages/engine"]
  labels: ["epic:setup", "type:chore", "priority:P0", "size:S"]
  milestone: M0 Foundation

- title: "Add ESLint and Prettier with one pnpm lint entry point"
  epic: setup
  why: "Formatting debates in review are wasted minutes; automate the answer once."
  actions: ["ESLint flat config with the TS and React plugins", "Prettier with the Tailwind class-sorting plugin", "Commit VS Code format-on-save settings"]
  acceptance: ["pnpm lint fails CI on error", "pnpm format rewrites the tree idempotently"]
  labels: ["epic:setup", "type:chore", "priority:P1", "size:XS", "good first issue"]
  milestone: M0 Foundation

- title: "Add a custom ESLint rule banning Math.random inside game packages"
  epic: setup
  why: "Every gameplay-affecting random draw must come from the seeded RNG, or replays, deterministic tests, and future online play all break."
  actions: ["Add a no-restricted-properties rule scoped to packages/games and packages/engine", "Document the seeded RNG alternative in the error message"]
  acceptance: ["Math.random() in a game package fails lint with a message naming the replacement"]
  labels: ["epic:setup", "type:chore", "priority:P1", "size:XS", "good first issue"]
  milestone: M0 Foundation

- title: "Set up Vitest with jsdom and a canvas mock"
  epic: setup
  why: "Rules and physics must be testable headlessly; waiting on a browser to test a win condition makes nobody write the test."
  actions: ["Install Vitest, jsdom, and a canvas stub", "Add a shared test setup file", "Wire pnpm test and pnpm test:watch"]
  acceptance: ["pnpm test runs in under 30 seconds on an empty suite", "A canvas-touching module imports without throwing in tests"]
  labels: ["epic:setup", "epic:qa", "type:chore", "priority:P0", "size:S"]
  milestone: M0 Foundation

- title: "Add a Vitest coverage gate for engine and rules modules"
  epic: setup
  why: "Coverage across the whole repo is noise; coverage on the simulation core is the part that actually protects gameplay."
  actions: ["Enable v8 coverage", "Set a 70% threshold scoped to packages/engine and any rules.ts", "Fail CI below threshold"]
  acceptance: ["Coverage report published as a CI artefact", "Dropping engine coverage below 70% fails the build"]
  labels: ["epic:setup", "epic:qa", "type:chore", "priority:P2", "size:S"]
  milestone: M0 Foundation

- title: "Add Playwright with Chromium, Firefox, and WebKit projects"
  epic: setup
  why: "iOS Safari diverges on audio unlock, viewport units, and touch handling; only a real WebKit run catches it."
  actions: ["Install Playwright and browsers", "Configure three projects plus a mobile viewport", "Add pnpm e2e"]
  acceptance: ["A smoke test loads the home route and asserts a heading in all three browsers"]
  labels: ["epic:setup", "epic:qa", "type:chore", "priority:P1", "size:S"]
  milestone: M0 Foundation

- title: "Build the CI pipeline: install, lint, typecheck, test, build"
  epic: setup
  why: "Without CI the definition of done is an opinion."
  actions: ["GitHub Actions workflow on pull_request and push to main", "Cache the pnpm store", "Run jobs in parallel where independent"]
  acceptance: ["Full pipeline completes in under 8 minutes", "A failing lint or type error blocks the merge"]
  labels: ["epic:setup", "type:chore", "priority:P0", "size:M"]
  milestone: M0 Foundation

- title: "Add a bundle-size budget check with size-limit"
  epic: setup
  why: "Payload creep is the most likely silent quality regression on a games site, and it shows up as slow first play, not as an error."
  actions: ["Configure size-limit for the shell bundle and per-game chunks", "Fail CI over budget", "Comment the diff against main on the PR"]
  acceptance: ["Shell JS budget 150KB gzipped, per-game budget 80KB gzipped", "CI comment shows the size delta"]
  labels: ["epic:setup", "epic:perf", "type:chore", "priority:P1", "size:M"]
  milestone: M0 Foundation

- title: "Add issue templates and a pull request template"
  epic: setup
  why: "A PR checklist is where the a11y, size, and asset-licence rules get enforced in practice."
  actions: ["Issue forms for bug, new game, and balance change", "PR template with tests, a11y, size, and asset-licence checkboxes"]
  acceptance: [".github templates render correctly on GitHub"]
  labels: ["epic:setup", "type:chore", "priority:P2", "size:XS", "good first issue"]
  milestone: M0 Foundation

- title: "Add CODEOWNERS and protect the main branch"
  epic: setup
  why: "The engine and input packages are where a careless change breaks all 99 games at once."
  actions: ["CODEOWNERS assigning packages/engine and packages/input", "Require green CI and one approval on main"]
  acceptance: ["Direct pushes to main are rejected", "Engine changes request the named owner automatically"]
  labels: ["epic:setup", "type:chore", "priority:P2", "size:XS", "good first issue"]
  milestone: M0 Foundation

- title: "Add secret scanning and dependency vulnerability scanning"
  epic: setup
  why: "A committed key or a critical advisory should stop a merge, not be discovered by a stranger."
  actions: ["Enable GitHub secret scanning and push protection", "Add a dependency audit step to CI", "Fail on high severity"]
  acceptance: ["A test secret is blocked at push time", "A high-severity advisory fails CI"]
  labels: ["epic:setup", "type:chore", "priority:P1", "size:S"]
  milestone: M1 Playable Shell

- title: "Add Dependabot with grouped weekly updates"
  epic: setup
  why: "Ungrouped bot PRs get ignored, then the upgrade becomes a project of its own."
  actions: ["dependabot.yml grouping minor and patch updates", "Auto-merge patch updates on green CI"]
  acceptance: ["One grouped PR per week", "Patch updates merge themselves when CI is green"]
  labels: ["epic:setup", "type:chore", "priority:P3", "size:XS", "good first issue"]
  milestone: M2 Game Catalog

- title: "Set up Vercel preview deployments per pull request"
  epic: setup
  why: "Two-player feel cannot be reviewed from a diff; reviewers need a URL they can open on a phone."
  actions: ["Connect the repo to Vercel", "Comment the preview URL on each PR", "Tear down on merge"]
  acceptance: ["Every PR gets a unique working preview URL"]
  labels: ["epic:setup", "type:chore", "priority:P1", "size:S"]
  milestone: M1 Playable Shell

- title: "Write the repo README and architecture overview"
  epic: docs
  why: "A contributor who cannot find the engine boundary will put game logic in the shell."
  actions: ["README with layout, commands, and the 30-second project description", "docs/architecture.md with a diagram of shell, SDK, engine, and games"]
  acceptance: ["A new contributor can run the app and locate the engine within 10 minutes of reading"]
  labels: ["epic:docs", "type:chore", "priority:P2", "size:S"]
  milestone: M1 Playable Shell

- title: "Write CONTRIBUTING.md including the research scope boundary"
  epic: docs
  why: "The rule that we observe reference apps by playing them and never extract from them has to be written down where contributors actually look."
  actions: ["Document branch naming, commit style, and the definition of done", "State the no-decompile, no-asset-extraction boundary explicitly", "Document how to add a game"]
  acceptance: ["A contributor can add a stub game in under 20 minutes following only this doc"]
  labels: ["epic:docs", "epic:legal", "type:chore", "priority:P2", "size:S"]
  milestone: M1 Playable Shell

- title: "Add an ADR template and record the first three decisions"
  epic: docs
  why: "In six months nobody will remember why Canvas2D beat WebGL as the default, and someone will redo the analysis."
  actions: ["Add docs/adr/template.md", "Write ADRs for the framework choice, the renderer choice, and the fixed-timestep decision"]
  acceptance: ["Three ADRs committed with context, decision, and consequences"]
  labels: ["epic:docs", "type:spec", "priority:P2", "size:S", "good first issue"]
  milestone: M1 Playable Shell

# ---------- E01 DESIGN SYSTEM ----------
- title: "Define the colour token set including the P1/P2 player pair"
  epic: design
  why: "The reference app uses red for player one and blue for player two on every screen; our equivalent pair must be one source of truth shared by CSS and canvas code."
  actions: ["Define ink, surface, elevated, paper, p1, p2, accent, success, danger as CSS custom properties", "Export the same values as a typed TS object for canvas rendering", "Document contrast ratios"]
  acceptance: ["No component or game hardcodes a hex value", "The TS export and the CSS variables cannot drift, verified by a test"]
  labels: ["epic:design", "type:spec", "priority:P0", "size:M", "needs-design"]
  milestone: M0 Foundation

- title: "Define the type scale and load the display, body, and mono faces"
  epic: design
  why: "Scoreboards need tabular figures; a proportional font makes a ticking timer visibly jitter."
  actions: ["Pick and self-host a display face, a body face, and a monospace face for scores and timers", "Define a modular scale with clamp() for fluid sizing", "Subset and preload"]
  acceptance: ["Fonts are self-hosted with font-display swap", "Timers use tabular figures and do not shift width as digits change"]
  labels: ["epic:design", "type:spec", "priority:P1", "size:M", "needs-design"]
  milestone: M0 Foundation

- title: "Define the spacing, radius, elevation, and z-index scales"
  epic: design
  why: "Ad-hoc spacing is how a site starts looking amateur, and ad-hoc z-index is how a modal ends up behind a HUD."
  actions: ["4px-based spacing scale as tokens", "Radius and shadow tokens", "A named z-index scale with documented layers"]
  acceptance: ["No raw pixel margins in components", "Every z-index in the codebase comes from the scale"]
  labels: ["epic:design", "type:spec", "priority:P1", "size:S"]
  milestone: M0 Foundation

- title: "Configure Tailwind v4 to consume the design tokens"
  epic: design
  why: "Tokens that Tailwind does not know about get bypassed the first time someone is in a hurry."
  actions: ["Map tokens into the Tailwind theme", "Disable the default palette so off-token colours are unavailable", "Add the class-sorting plugin"]
  acceptance: ["bg-p1 and text-ink resolve from tokens", "An arbitrary hex in a class name fails lint"]
  labels: ["epic:design", "type:chore", "priority:P1", "size:S"]
  milestone: M0 Foundation

- title: "Define the motion system: durations, easings, and the reduced-motion policy"
  epic: design
  why: "Motion decided per component produces a site that feels twitchy in one place and sluggish in another."
  actions: ["Duration and easing tokens", "Document which motions are decorative and which are informative", "Define what each becomes under prefers-reduced-motion"]
  acceptance: ["Documented policy: decorative motion disabled, informative motion becomes an instant state change", "Tokens used by both CSS and the JS tween layer"]
  labels: ["epic:design", "epic:a11y", "type:spec", "priority:P1", "size:M"]
  milestone: M0 Foundation

- title: "Design the brand identity: name treatment, logo, and favicon set"
  epic: design
  why: "The site needs its own identity; nothing may echo the reference app's branding."
  actions: ["Wordmark and monogram as SVG", "Full favicon and app-icon set including maskable variants", "Document minimum sizes and clear space"]
  acceptance: ["Icons render correctly as a browser tab, an installed PWA, and a social preview", "Nothing derives from another product's branding"]
  labels: ["epic:design", "epic:legal", "type:feat", "priority:P2", "size:M", "needs-design"]
  milestone: M3 Premium Site

- title: "Build the icon set as an optimised sprite"
  epic: design
  why: "Icon fonts and one-off SVG imports both bloat; a sprite keeps it to a single cached request."
  actions: ["Draw or license the needed glyphs", "Generate an SVG sprite at build time", "Add a typed Icon component"]
  acceptance: ["Icons are tree-shaken per route", "Every icon has an accessible label or is marked decorative"]
  labels: ["epic:design", "epic:perf", "type:feat", "priority:P2", "size:M"]
  milestone: M1 Playable Shell

- title: "Set up Storybook for the UI package"
  epic: design
  why: "Reviewing a button in six states inside a running game is slow and unreliable."
  actions: ["Install Storybook for the Next.js setup", "Add a token-driven theme decorator", "Publish as a CI artefact"]
  acceptance: ["Every shared component has a story per state", "Storybook builds in CI"]
  labels: ["epic:design", "epic:setup", "type:chore", "priority:P2", "size:M"]
  milestone: M1 Playable Shell

- title: "Implement dark and light themes with a persisted user override"
  epic: design
  why: "A games site is used in bed at night and on a bus at noon; one theme cannot serve both."
  actions: ["Token overrides per theme", "Respect prefers-color-scheme on first visit", "Persist the override and apply it before first paint to avoid a flash"]
  acceptance: ["No flash of the wrong theme on load", "Contrast verified in both themes"]
  labels: ["epic:design", "epic:a11y", "type:feat", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

# ---------- E02 SITE SHELL & ROUTES ----------
- title: "Build the root layout with header, main region, and footer"
  epic: site
  why: "Every route hangs off this; getting the landmark structure right once fixes accessibility everywhere."
  actions: ["App Router root layout with correct landmark elements", "Skip-to-content link", "Theme and font providers"]
  acceptance: ["One h1 per route", "Skip link works with the keyboard", "Landmarks pass an automated audit"]
  labels: ["epic:site", "epic:a11y", "type:feat", "priority:P0", "size:S"]
  milestone: M0 Foundation

- title: "Build the site header with logo, navigation, and mode toggle"
  epic: site
  why: "The reference app puts the two-player versus one-player choice above everything, because it changes the entire catalog."
  actions: ["Header with the wordmark, primary nav, and a 2P/1P segmented control", "Sticky on scroll with a compact variant", "Mobile layout"]
  acceptance: ["The mode toggle filters the catalog immediately", "The choice persists across navigation and reloads"]
  labels: ["epic:site", "type:feat", "priority:P1", "size:M"]
  milestone: M1 Playable Shell

- title: "Build the site footer with legal, about, and language links"
  epic: site
  why: "Privacy, terms, and contact links must exist on every page before launch."
  actions: ["Footer with grouped links, a language switcher slot, and the copyright line"]
  acceptance: ["Present on every route", "Keyboard reachable, no layout shift"]
  labels: ["epic:site", "type:feat", "priority:P3", "size:XS", "good first issue"]
  milestone: M3 Premium Site

- title: "Define the URL and route structure for the whole site"
  epic: site
  why: "Route shape decides SEO and shareability; changing it after launch costs the accumulated rankings."
  actions: ["Decide and document /, /games, /games/[slug], /play/[slug], /tournament, /category/[slug], /settings", "Decide trailing-slash and casing rules", "Write the redirect policy"]
  acceptance: ["Documented route table committed", "Every game is reachable at a stable, human-readable URL"]
  labels: ["epic:site", "epic:seo", "type:spec", "priority:P0", "size:S"]
  milestone: M0 Foundation

- title: "Build the game catalog grid page"
  epic: site
  why: "This is the page most visitors land on from search and the main path into a match."
  actions: ["Responsive grid, two columns on phones scaling up on wider screens", "Server-rendered from the game registry", "Lazy-load below-the-fold cards"]
