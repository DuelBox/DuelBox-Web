  labels: ["epic:site", "epic:seo", "type:feat", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Build the game card component with static and animated states"
  epic: site
  why: "The reference app ships static thumbnails only; a cheap looping preview on hover or focus is a real conversion advantage."
  actions: ["Card with thumbnail, title, category, player count, and round length", "Preview loop on hover and keyboard focus", "Static frame under reduced-motion or save-data"]
