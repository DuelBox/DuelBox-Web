  acceptance: ["Connection succeeds behind symmetric NAT via relay"]
  labels: ["epic:online", "type:feat", "priority:P3", "size:L"]
  milestone: M4 Online

- title: "Implement deterministic lockstep with input delay"
  epic: online
  why: "The fixed timestep and seeded RNG were built for this; lockstep is what turns them into online play."
  actions: ["Exchange inputs with a configurable delay", "Hash state every N frames to detect desync", "Resync or forfeit on desync, never diverge silently"]
  acceptance: ["Desync is always detected and surfaced, never silent"]
  labels: ["epic:online", "epic:engine", "type:feat", "priority:P3", "size:L"]
  milestone: M4 Online

- title: "Implement invite links and private rooms"
  epic: online
  why: "The natural way to start an online match is pasting a link into a chat."
  actions: ["Shareable link that joins a room directly", "Work from any messenger", "Handle expired or full rooms gracefully"]
  acceptance: ["A pasted link joins the room in one tap"]
  labels: ["epic:online", "type:feat", "priority:P3", "size:M"]
  milestone: M4 Online

- title: "Implement disconnect handling and reconnect grace"
  epic: online
  why: "Mobile connections drop constantly; an instant forfeit makes online play miserable."
  actions: ["Thirty-second reconnect window", "Clear opponent-side messaging while waiting", "Consistent, documented forfeit rules"]
  acceptance: ["A brief disconnect resumes the match rather than ending it"]
  labels: ["epic:online", "type:feat", "priority:P3", "size:M"]
  milestone: M4 Online

- title: "Implement server-side score validation and anti-cheat"
  epic: backend
  why: "Any client-submitted score is a claim, not a fact, and a public leaderboard is an invitation to test that."
  actions: ["Reject scores outside physically achievable bounds", "Rate limit per identity", "Flag suspicious submissions for review rather than dropping them silently"]
  acceptance: ["Fabricated scores are rejected and logged"]
  labels: ["epic:backend", "type:feat", "priority:P3", "size:L"]
  milestone: M4 Online

- title: "Implement global leaderboards per game"
  epic: backend
  why: "A leaderboard is the reason to play a solo game a second time."
  actions: ["Daily, weekly, and all-time boards", "Paginate and cache at the edge", "Exclude assist-mode results"]
  acceptance: ["Boards load fast under cache and exclude assisted runs"]
  labels: ["epic:backend", "type:feat", "priority:P3", "size:M"]
  milestone: M4 Online

- title: "Implement reporting, name filtering, and a moderation queue"
  epic: online
  why: "Any system with player-visible names needs this before it has users, not after."
  actions: ["Report flow from the match and leaderboard", "Name filtering before display", "Internal review queue"]
  acceptance: ["A reported name reaches the queue and can be actioned"]
  labels: ["epic:online", "epic:legal", "type:feat", "priority:P3", "size:M"]
  milestone: M4 Online

- title: "Implement optional accounts with local progress migration"
  epic: backend
  why: "Nothing may be gated behind an account, but a pair changing phones should not lose their record."
  actions: ["OAuth sign-in that stays optional everywhere", "Migrate local progress on first sign-in without loss", "Handle merge conflicts explicitly"]
  acceptance: ["Signing in never loses local progress", "Every feature still works signed out"]
  labels: ["epic:backend", "type:feat", "priority:P3", "size:L"]
  milestone: M4 Online

- title: "Load test the room server"
  epic: online
  why: "Discovering the concurrency ceiling during a traffic spike is discovering it too late."
  actions: ["Simulate thousands of concurrent rooms", "Record resource usage and cost per thousand rooms", "Document the scaling plan"]
  acceptance: ["Ten thousand concurrent rooms sustained with documented cost"]
  labels: ["epic:online", "epic:qa", "type:chore", "priority:P3", "size:M"]
  milestone: M4 Online

# =====================================================================
# E20 CROSS-DEVICE PLAY
# Two people must be able to play together whether they are sharing one
# phone or sitting on opposite sides of the world on a phone and a laptop.
# That is two different presentations of the same game, plus a transport,
# plus a fairness problem — and it constrains the engine from day one.
# =====================================================================

- title: "Spec the two presentation modes: shared-screen and single-seat"
  epic: crossplay
  why: "The same game has to render two different ways. On one device two seats share the screen; on two devices each player owns the whole screen in their own orientation. If this is not designed up front, every game gets a bespoke second layout bolted on later."
  actions:
    - "Define presentation as a first-class concept: shared-screen (two seats, one viewport) and single-seat (one seat, full viewport)"
    - "Document how the HUD, controls, seat rotation, and safe areas differ between them"
    - "Decide which presentation each archetype defaults to, and how a game declares support"
    - "Specify what happens to seat rotation in single-seat mode - the play area no longer flips, it is always upright for the local player"
  acceptance:
    - "Doc committed covering both presentations with a decision table per archetype"
    - "Every downstream presentation issue references this spec rather than re-deciding"
    - "Reviewed before any game implements its second presentation"
  labels: ["epic:crossplay", "epic:sdk", "type:spec", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Make the simulation viewport-independent by running in fixed logical units"
  epic: crossplay
  why: "A phone and a laptop must simulate the identical match. If any simulation value is expressed in pixels, the two devices diverge and lockstep netcode is impossible before it is even attempted."
  actions:
    - "Define a fixed logical coordinate space per game, declared in the manifest"
    - "Audit the engine for any simulation value derived from canvas or window size"
    - "Move all pixel conversion into the render layer so update() never sees a device dimension"
    - "Add a test that runs the same input trace at three viewport sizes and asserts identical final state"
  acceptance:
    - "Simulation output is bit-identical across viewport sizes, proven by test"
    - "No engine or game update path reads canvas, window, or devicePixelRatio"
    - "Logical resolution is declared per game and validated at build time"
  labels: ["epic:crossplay", "epic:engine", "type:feat", "priority:P0", "size:L"]
  milestone: M0 Foundation

- title: "Guarantee an identical logical viewport for both players in remote play"
  epic: crossplay
  why: "This is the fairness problem nobody sees coming. If the laptop player's wider screen shows more of the arena than the phone player's, the laptop player has a real competitive advantage. Both must see exactly the same play area, letterboxed differently."
  actions:
    - "Negotiate a common logical viewport at match start, independent of either device's screen"
    - "Letterbox each device to that viewport rather than filling its screen"
    - "Never reveal play area outside the negotiated viewport, even when screen space is available"
    - "Use the surplus space for HUD and controls instead"
  acceptance:
    - "Two devices with different aspect ratios show the identical play area, verified side by side"
    - "No player can see a game object the other cannot"
    - "Surplus screen space is used for chrome, never for extra field of view"
  labels: ["epic:crossplay", "epic:engine", "type:feat", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Implement the presentation abstraction in the game SDK"
  epic: crossplay
  why: "Games should express what they draw once and let the SDK place it, or 107 games each grow two divergent layout implementations."
  actions:
    - "Expose the active presentation and local seat to the game through the context"
    - "Have the SDK own HUD placement, control zones, and rotation per presentation"
    - "Give games a declarative way to say where their play area and control zones sit"
    - "Provide a dev toggle to switch presentation live for testing"
  acceptance:
    - "A game supports both presentations without branching on device type"
    - "Switching presentation at runtime does not disturb simulation state"
    - "The dev toggle is stripped from production bundles"
  labels: ["epic:crossplay", "epic:sdk", "type:feat", "priority:P0", "size:L"]
  milestone: M1 Playable Shell

- title: "Add supported presentations and device classes to the game manifest"
  epic: crossplay
  why: "Some games genuinely do not work remotely, and some do not work on a phone in portrait. The catalog must know before a player picks one and hits a dead end."
  actions:
    - "Add supportedPresentations, minViewport, and preferredOrientation to the manifest schema"
    - "Validate at build time that a declared presentation is actually implemented"
    - "Surface the constraints on the game page and filter the catalog by them"
  acceptance:
    - "A game that cannot be played remotely never offers the remote option"
    - "The catalog can be filtered to what the current device supports"
    - "Build fails when a declaration and the implementation disagree"
  labels: ["epic:crossplay", "epic:sdk", "type:feat", "priority:P1", "size:M"]
  milestone: M1 Playable Shell

- title: "Write the cross-device input parity design document"
  epic: crossplay
  why: "A thumb on a phone and a mouse on a laptop are not equivalent instruments. A mouse is more precise, a thumb occludes the screen, and a trackpad drags differently from both. Left unaddressed, cross-device matches are decided by hardware rather than skill."
  actions:
    - "Enumerate the input families: touch, mouse, trackpad, keyboard, gamepad, pen"
    - "For each game archetype, identify where a family has an inherent advantage"
    - "Decide the normalisation policy per interaction: aim precision, drag distance, tap latency, hold timing"
    - "Define which games are fair cross-device and which should be same-class only"
  acceptance:
    - "Doc committed with a per-archetype, per-family parity table"
    - "Each game archetype has a stated normalisation rule"
    - "Games judged unfair cross-device are flagged in the manifest rather than shipped unfair"
  labels: ["epic:crossplay", "epic:input", "type:spec", "priority:P0", "size:L"]
  milestone: M1 Playable Shell

- title: "Unify touch, mouse, trackpad, and pen behind pointer events"
  epic: crossplay
  why: "Games must not branch on input hardware. One code path for every pointing device is what makes a phone and a laptop able to play the same build."
  actions:
    - "Route all pointing input through Pointer Events with a single normalised representation"
    - "Preserve pressure and pointer type where available without requiring them"
    - "Keep the existing per-seat zone ownership rule intact for multi-pointer devices"
    - "Handle mouse leaving the window mid-drag the way a lifted finger is handled"
  acceptance:
    - "A drag-to-aim game plays identically with a finger, a mouse, and a trackpad"
    - "No game code reads pointerType to decide behaviour"
    - "Pointer capture survives the pointer leaving the canvas"
  labels: ["epic:crossplay", "epic:input", "type:feat", "priority:P0", "size:M"]
  milestone: M0 Foundation

- title: "Normalise aim precision across pointing devices"
  epic: crossplay
  why: "A mouse can place a shot within a pixel; a thumb covering the target cannot. Without normalisation every aim game is won by whoever brought a laptop."
  actions:
    - "Express aim as a normalised vector over a device-independent drag distance, not raw pixels"
    - "Apply a consistent precision envelope so no family can aim finer than the envelope allows"
    - "Scale the envelope by the negotiated logical viewport rather than the physical screen"
    - "Verify with a measured test: same intended shot, three devices, comparable outcomes"
  acceptance:
    - "Measured shot dispersion is comparable across touch, mouse, and trackpad"
    - "No family can exceed the shared precision envelope"
    - "The envelope is a documented constant, not a per-game guess"
  labels: ["epic:crossplay", "epic:input", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Measure and compensate input latency differences between device classes"
  epic: crossplay
  why: "Reaction games are decided in tens of milliseconds. A cheap Android browser and a desktop Chrome do not deliver an input on the same schedule, and in a reaction duel that gap is the whole game."
  actions:
    - "Measure end-to-end input latency per device class using the existing latency harness"
    - "Timestamp inputs at the source and resolve reaction outcomes on those timestamps, not arrival order"
    - "Define the tolerance below which two inputs are declared simultaneous"
    - "Show the measured latency in the debug overlay during remote matches"
  acceptance:
    - "Reaction outcomes are decided by source timestamp, never by packet arrival"
    - "A documented tolerance window exists and is applied by the shared tie helper"
    - "Latency figures are recorded per device class in the test matrix"
  labels: ["epic:crossplay", "epic:input", "type:feat", "priority:P1", "size:L"]
  milestone: M2 Game Catalog

- title: "Negotiate device capability at match start"
  epic: crossplay
  why: "Before the countdown, both clients need to agree on what they can both do: the shared viewport, the frame budget, the input families in play, and whether either side needs assistive settings."
  actions:
    - "Exchange capability descriptors on connection: viewport, DPR, input families, reduced-motion, save-data"
    - "Compute the shared match configuration from the intersection"
    - "Show each player what the other is playing on, without exposing anything personal"
    - "Refuse to start and explain clearly when no viable shared configuration exists"
  acceptance:
    - "Both clients derive an identical match configuration from the same exchange"
    - "An impossible pairing fails before the countdown with a readable reason"
    - "No device identifier or personal data is exchanged"
  labels: ["epic:crossplay", "epic:online", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Map every game action onto each input family for single-seat play"
  epic: crossplay
  why: "In shared-screen play a seat gets half a keyboard or half a screen. Alone on a laptop the same player has the whole keyboard and a mouse, and the control scheme should use it rather than pretend the other half is occupied."
  actions:
    - "Define a full-device control scheme per game archetype for keyboard, pointer, and gamepad"
    - "Keep the action set identical to shared-screen play so rules never change with presentation"
    - "Show the correct scheme in the lobby for the detected device and presentation"
  acceptance:
    - "Every game is fully playable single-seat with keyboard alone and with pointer alone"
    - "The action set is identical across presentations"
    - "The lobby diagram matches what the player actually has in hand"
  labels: ["epic:crossplay", "epic:input", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Implement the remote session model and room lifecycle"
  epic: crossplay
  why: "Cross-device play needs a room before it needs netcode: create, share, join, start, rejoin, end."
  actions:
    - "Create a room and produce a short human-sayable join code plus a link"
    - "Join by code or link from any device, with a clear waiting state"
    - "Handle the room being full, expired, or already started"
    - "Garbage-collect abandoned rooms"
  acceptance:
    - "Two devices reach a started match from a shared link in under three taps each"
    - "Every failure mode has a specific, actionable message"
    - "Abandoned rooms disappear without manual intervention"
  labels: ["epic:crossplay", "epic:online", "type:feat", "priority:P1", "size:L"]
  milestone: M2 Game Catalog

- title: "Implement the transport: WebSocket signalling with a WebRTC data channel and TURN fallback"
  epic: crossplay
  why: "Peer-to-peer keeps latency and cost low, but a real share of mobile networks block it, and a game that only works on friendly networks is a game that looks broken at random."
  actions:
    - "Signal over WebSocket, upgrade to a WebRTC data channel when possible"
    - "Fall back to relay when NAT traversal fails, transparently to the game"
    - "Expose one transport interface so game and netcode never know which is in use"
    - "Model the relay cost before launch"
  acceptance:
    - "A match completes on a mobile network that blocks peer-to-peer"
    - "The game layer cannot tell which transport is active"
    - "Fallback happens without a visible interruption"
  labels: ["epic:crossplay", "epic:online", "type:feat", "priority:P1", "size:L"]
  milestone: M4 Online

- title: "Implement clock synchronisation between paired devices"
  epic: crossplay
  why: "Timestamped inputs, countdowns, and match timers all assume the two devices agree on the time. They do not, by default, and the drift is large enough to matter."
  actions:
    - "Estimate offset and round-trip time with a periodic exchange"
    - "Expose a shared match clock derived from the estimate"
    - "Re-estimate during play and correct smoothly rather than jumping"
    - "Drive the countdown from the shared clock so both see 3-2-1 together"
  acceptance:
    - "Countdown start differs by less than one frame between devices"
    - "Clock corrections never jump the simulation"
    - "Offset and round-trip time are visible in the debug overlay"
  labels: ["epic:crossplay", "epic:online", "type:feat", "priority:P1", "size:M"]
  milestone: M4 Online

- title: "Implement state synchronisation for turn-based remote games"
  epic: crossplay
  why: "Board games do not need lockstep. They need a move to be validated, applied identically on both sides, and never lost."
  actions:
    - "Send moves rather than state, and apply them through the same rules module both sides run"
    - "Acknowledge and retry so a dropped move cannot desync the board"
    - "Reconcile on reconnect by replaying the move log"
    - "Reject illegal moves server-side or peer-side rather than trusting the sender"
  acceptance:
    - "A board game survives a dropped packet and a mid-match reconnect with identical state"
    - "An illegal move is refused rather than applied"
    - "Move log replay reproduces the board exactly"
  labels: ["epic:crossplay", "epic:online", "type:feat", "priority:P1", "size:L"]
  milestone: M4 Online

- title: "Implement deterministic lockstep with input delay for real-time remote games"
  epic: crossplay
  why: "The fixed timestep, seeded RNG, and logical-unit simulation were all built for this moment. Lockstep is what turns them into a real-time match between two devices."
  actions:
    - "Exchange per-step inputs with a configurable delay tuned to measured round-trip time"
    - "Stall rather than diverge when an input has not arrived"
    - "Hash state every N steps and compare"
    - "Surface a desync explicitly and end the match cleanly rather than drifting"
  acceptance:
    - "Two devices run a full real-time match with identical final state"
    - "A desync is always detected and reported, never silent"
    - "Input delay adapts to the measured connection rather than being fixed"
  labels: ["epic:crossplay", "epic:online", "epic:engine", "type:feat", "priority:P1", "size:L"]
  milestone: M4 Online

- title: "Implement disconnect, reconnect, and forfeit rules for remote matches"
  epic: crossplay
  why: "Mobile connections drop constantly. An instant forfeit on a subway tunnel makes remote play miserable."
  actions:
    - "Hold the match through a defined reconnect window with clear messaging on the other side"
    - "Resume from the move log or the last agreed state"
    - "Apply and document consistent forfeit rules when the window expires"
    - "Let the waiting player leave without being trapped"
  acceptance:
    - "A thirty-second dropout resumes rather than ending the match"
    - "The waiting player always knows what is happening and can leave"
    - "Forfeit rules are identical for both sides"
  labels: ["epic:crossplay", "epic:online", "type:feat", "priority:P2", "size:M"]
  milestone: M4 Online

- title: "Handle hidden-information games in remote play"
  epic: crossplay
  why: "Sea Battle needs a blackout hand-off on one device. On two devices the problem inverts: each player simply must not receive the other's secret state at all."
  actions:
    - "Ensure hidden state is never transmitted to the opponent's client, not merely hidden in its UI"
    - "Validate reveals against the authoritative state so a modified client cannot peek"
    - "Skip the pass-and-play blackout entirely in single-seat presentation"
  acceptance:
    - "An opponent's client never receives hidden state, verified by inspecting traffic"
    - "The blackout screen does not appear in remote play"
    - "A tampered client cannot reveal what it was not sent"
  labels: ["epic:crossplay", "epic:online", "type:feat", "priority:P2", "size:M"]
  milestone: M4 Online

- title: "Support cross-device tournaments"
  epic: crossplay
  why: "The tournament is the retention hook. Restricting it to one device would make remote play feel like a lesser mode."
  actions:
    - "Carry tournament state across the remote session rather than a single device"
    - "Keep both clients agreed on the running score and the next game"
    - "Handle one player dropping mid-tournament without losing the run"
  acceptance:
    - "A seven-game tournament completes across two devices with a consistent score"
    - "A reconnect mid-tournament resumes at the right game"
  labels: ["epic:crossplay", "epic:meta", "type:feat", "priority:P2", "size:M"]
  milestone: M4 Online

- title: "Show connection quality and what the opponent is playing on"
  epic: crossplay
  why: "When a remote match feels sluggish players blame the game. Showing latency and connection state moves the explanation to where it belongs."
  actions:
    - "Display round-trip time and packet loss during remote matches"
    - "Warn when the connection degrades enough to affect fairness"
    - "Indicate the opponent's device class without revealing anything identifying"
  acceptance:
    - "Latency and loss are visible without obscuring play"
    - "A degrading connection produces a warning before the match becomes unfair"
  labels: ["epic:crossplay", "epic:online", "epic:ui", "type:feat", "priority:P3", "size:S"]
  milestone: M4 Online

- title: "Build the cross-device test harness"
  epic: crossplay
  why: "Cross-device bugs only appear with two clients at different viewports. Testing that by hand with two phones does not scale to 107 games."
  actions:
    - "Drive two browser contexts at different viewports and input families in one Playwright run"
    - "Assert both clients reach identical final state from a scripted input trace"
    - "Simulate latency, jitter, and packet loss"
    - "Make it reusable as the per-game cross-play acceptance test"
  acceptance:
    - "A single command runs a full cross-device match for a named game"
    - "Injected latency and loss are configurable"
    - "Every game's cross-play issue can close against this harness"
  labels: ["epic:crossplay", "epic:qa", "type:feat", "priority:P1", "size:L"]
  milestone: M2 Game Catalog

- title: "Add anti-cheat considerations for peer-to-peer matches"
  epic: crossplay
  why: "In a peer-to-peer match there is no server to trust. A modified client can claim any input, and the honest player has no recourse."
  actions:
    - "Document the threat model for casual peer-to-peer play"
    - "Validate inputs against what the rules allow before applying them"
    - "Detect impossible timing and reject rather than accept"
    - "Decide which games need server authority before they can carry a public result"
  acceptance:
    - "Threat model committed with a decision per game class"
    - "Rule-illegal inputs are refused by the receiving client"
    - "Results from unauthenticated peer play are never written to a public board"
  labels: ["epic:crossplay", "epic:backend", "type:spec", "priority:P2", "size:M"]
  milestone: M4 Online

# =====================================================================
# E21 RESPONSIVE ACROSS EVERY DEVICE
# Phone, tablet, laptop, desktop; portrait and landscape; any size.
# =====================================================================

- title: "Write the responsive strategy for the game canvas"
  epic: responsive
  why: "Every game renders into a box whose size we do not control, on screens from a 320px phone to a 4K monitor. One strategy decided once beats 107 improvisations."
  actions:
    - "Define fixed logical resolution per game, scaled to fit with letterboxing"
    - "Decide the policy for aspect ratios wider or taller than the logical space"
    - "Specify how safe-area insets, browser chrome, and on-screen keyboards are accounted for"
    - "Define the minimum supported viewport and what happens below it"
  acceptance:
    - "Doc committed and referenced by every per-game responsive issue"
    - "The policy covers portrait, landscape, and square-ish tablet ratios"
    - "Below-minimum viewports get a clear message, not a broken canvas"
  labels: ["epic:responsive", "epic:engine", "type:spec", "priority:P0", "size:M"]
  milestone: M0 Foundation

- title: "Define the device class breakpoints and the shell grid"
  epic: responsive
  why: "Phone, large phone, tablet portrait, tablet landscape, laptop, desktop, and ultrawide are genuinely different layouts, not one layout stretched."
  actions:
    - "Define breakpoints and name each device class"
    - "Specify the catalog grid, header, and game page at each class"
    - "Use container queries where a component's context matters more than the viewport"
    - "Document which classes are tier-one supported"
  acceptance:
    - "Every shell route is designed at each named class, not just reflowed"
    - "No horizontal page scroll at any width from 320px to 4K"
  labels: ["epic:responsive", "epic:site", "type:spec", "priority:P0", "size:M"]
  milestone: M0 Foundation

- title: "Handle mobile browser chrome with dynamic viewport units"
  epic: responsive
  why: "On mobile Safari and Chrome the address bar appears and disappears mid-match, changing the viewport height under a running game. Using vh means the canvas resizes while someone is playing."
  actions:
    - "Use dynamic viewport units with a static fallback"
    - "Debounce resize so a scroll-triggered chrome change does not re-layout the canvas"
    - "Keep the logical play area constant across the change"
    - "Verify on iOS Safari, Chrome Android, and Samsung Internet"
  acceptance:
    - "The play area does not change size when browser chrome appears or hides"
    - "No layout thrash during a match"
  labels: ["epic:responsive", "epic:engine", "type:bug", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Implement safe-area handling for notches, home indicators, and rounded corners"
  epic: responsive
  why: "A control under a notch is a control nobody can press, and a score in a rounded corner is a score nobody can read."
  actions:
    - "Apply safe-area insets to the canvas container and all HUD placement"
    - "Keep interactive elements clear of system gesture areas"
    - "Verify in both orientations, where the insets differ"
  acceptance:
    - "No interactive or informational element falls under a notch, indicator, or corner"
    - "Verified in portrait and landscape on a notched device"
  labels: ["epic:responsive", "epic:engine", "type:feat", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Implement orientation handling and per-game orientation preference"
  epic: responsive
  why: "Two people sharing a phone in portrait is a different physical arrangement from sharing it in landscape, and some games only work in one."
  actions:
    - "Let a game declare its preferred and supported orientations"
    - "Re-layout rather than letterbox where the game supports both"
    - "Offer a non-blocking rotate prompt where it supports only one"
    - "Never lose match state across an orientation change"
  acceptance:
    - "Rotating mid-match preserves the simulation exactly"
    - "A single-orientation game prompts without blocking play"
    - "Games supporting both look designed in both, not stretched"
  labels: ["epic:responsive", "epic:engine", "type:feat", "priority:P1", "size:M"]
  milestone: M1 Playable Shell

- title: "Design tablet layouts rather than scaling phone layouts"
  epic: responsive
  why: "An iPad is the best device for two people sharing a screen and deserves a layout that uses the space, not a stretched phone view with enormous controls."
  actions:
    - "Design the catalog, game page, and shared-screen presentation at tablet sizes"
    - "Scale control zones to the physical size, not just the pixel count"
    - "Handle tablet portrait and landscape as separate designs"
    - "Verify split-view and stage-manager style resizing does not break the canvas"
  acceptance:
    - "Tablet layouts use the extra space deliberately"
    - "Controls remain comfortably reachable for two people at tablet size"
    - "Resizing in split view re-layouts cleanly"
  labels: ["epic:responsive", "epic:site", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Handle unusual aspect ratios: ultrawide, foldables, and square windows"
  epic: responsive
  why: "Ultrawide monitors, folding phones, and freely resized desktop windows all produce ratios no phone-first design anticipates."
  actions:
    - "Cap the play area and centre it rather than stretching on ultrawide"
    - "Handle fold and unfold as a resize that preserves match state"
    - "Test at extreme ratios in both directions"
  acceptance:
    - "No game distorts or reveals extra field of view at extreme ratios"
    - "Folding a device mid-match preserves state"
  labels: ["epic:responsive", "epic:engine", "type:feat", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

- title: "Scale touch targets by physical size rather than pixels"
  epic: responsive
  why: "A 44px target is comfortable on a phone and tiny on a high-density tablet held at arm's length. Fingers do not get smaller as pixels do."
  actions:
    - "Size interactive elements in physical units, accounting for device pixel ratio"
    - "Set a minimum physical size for gameplay controls"
    - "Verify on a low-density phone and a high-density tablet"
  acceptance:
    - "Controls are comfortably hittable on both density extremes"
    - "No target falls below the physical minimum on any supported device"
  labels: ["epic:responsive", "epic:a11y", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Respect user font scaling and zoom without breaking layouts"
  epic: responsive
  why: "People who scale their text up are not asking for a broken page, and browser zoom is the most common accessibility tool there is."
  actions:
    - "Use relative units for all shell typography"
    - "Verify every route at 200 percent zoom and at large system font sizes"
    - "Keep the canvas independent of text scaling so gameplay is unaffected"
  acceptance:
    - "No clipping or overlap at 200 percent zoom on any route"
    - "Gameplay is unaffected by text scale settings"
  labels: ["epic:responsive", "epic:a11y", "type:feat", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

- title: "Build the responsive verification harness"
  epic: responsive
  why: "Checking 107 games by hand at eight viewports is 856 manual checks. Automate the sweep and keep the human pass for feel."
  actions:
    - "Screenshot every route and every game at the named device classes in both orientations"
    - "Assert no horizontal overflow and no element outside safe areas"
    - "Surface diffs on the pull request"
    - "Make it reusable as the per-game responsive acceptance test"
  acceptance:
    - "One command produces the full matrix for a named game"
    - "Overflow and safe-area violations fail automatically"
    - "Every game's responsive issue can close against this harness"
  labels: ["epic:responsive", "epic:qa", "type:feat", "priority:P1", "size:L"]
  milestone: M2 Game Catalog

- title: "Define the device test matrix and acquire the hardware"
  epic: responsive
  why: "Emulated viewports do not surface thermal throttling, real touch behaviour, or browser quirks. The audience is largely on mid and low-end Android."
  actions:
    - "Name the tier-one devices: a low-end Android, a mid Android, a current iPhone, an iPad, a laptop"
    - "Record browser versions per device"
    - "Establish a per-release manual pass across the matrix"
  acceptance:
    - "Matrix committed and the hardware available to the team"
    - "Every release runs the pass before shipping"
  labels: ["epic:responsive", "epic:qa", "type:chore", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

# =====================================================================
# E22 ORIGINALITY AND UI INNOVATION
# The mechanics are free to reimplement; the product is not allowed to
# look like a copy. Nobody should be able to put our site beside the
# reference app and call it the same product. This epic is where that
# is made true on purpose rather than hoped for.
# =====================================================================

- title: "Write the product differentiation brief"
  epic: originality
  why: "Before any screen is designed, the team needs a written answer to 'why is this not just a clone?'. Without it, every individual design decision drifts toward the thing we were looking at, because that is the path of least resistance."
  actions:
    - "State what DuelBox is that the reference app is not: a web product with no install, cross-device play, per-game indexable pages, offline, and search"
    - "Name the three experiences we intend to be visibly better: browsing 107 games, pairing two devices, and running a tournament"
    - "List what we deliberately do NOT copy: layout, navigation model, card design, HUD arrangement, colour identity, iconography, copy voice, naming"
    - "Define the one-sentence product positioning every later design decision is checked against"
  acceptance:
    - "Brief committed and referenced by every design issue in this epic"
    - "A reviewer can use it to reject a design that drifts toward the reference"
    - "Agreed before the design language work starts"
  labels: ["epic:originality", "epic:design", "type:spec", "priority:P0", "size:M"]
  milestone: M0 Foundation

- title: "Establish our own visual identity and name the signature motif"
  epic: originality
  why: "A product with no signature element gets described by what it resembles. We need one idea, carried everywhere, that belongs to us."
  actions:
    - "Choose and document the signature motif - the proposed direction is the seam, a single diagonal split dividing the two players' territory, carried from the landing hero through the catalog into the live HUD"
    - "Derive the palette from the motif rather than adopting the reference app's red/blue pairing wholesale - our player colours must be recognisably ours and must pass colour-vision checks"
    - "Pick display, body, and data typefaces that read as a deliberate pairing, not a default"
    - "Show the motif applied to three different screens to prove it carries"
  acceptance:
    - "Identity documented with the motif demonstrated across at least three screens"
    - "Player colours differ meaningfully from the reference app and pass contrast and colour-vision checks"
    - "No colour, type, or spacing value is taken from the reference app"
  labels: ["epic:originality", "epic:design", "type:spec", "priority:P0", "size:L", "needs-design"]
  milestone: M0 Foundation

- title: "Reimagine catalog browsing rather than reproducing a flat scroll"
  epic: originality
  why: "The reference app puts 107 games in one unbroken scroll with no search, no categories, and no filters. Reproducing that would copy its single weakest screen. This is our clearest opportunity to be plainly better."
  actions:
    - "Design a browse model that makes 107 games tractable: category-led entry, search, filters for round length and player count, and a surfaced 'pick for us' path"
    - "Design the browse experience separately for phone, tablet, and desktop rather than reflowing one grid"
    - "Give returning pairs a route back to what they actually play - favourites and recent, prominent rather than buried"
    - "Prototype at least two distinct browse concepts and choose with reasons recorded"
  acceptance:
    - "Two concepts explored and the choice justified in writing"
    - "A visitor can go from landing to a specific game in under three interactions"
    - "The layout is not a two-column infinite grid"
  labels: ["epic:originality", "epic:site", "type:spec", "priority:P1", "size:L", "needs-design"]
  milestone: M1 Playable Shell

- title: "Design the in-match HUD from first principles"
  epic: originality
  why: "The reference app anchors a rotated score pill and an exit pill to the screen edges. That solves a real problem, but adopting its exact arrangement is the most recognisable thing we could copy."
  actions:
    - "Restate the constraints in our own terms: both seats must read the score, nothing may cover the play area, and it must work in shared-screen and single-seat presentations"
    - "Design a HUD that satisfies them without reproducing the edge-pill arrangement"
    - "Handle score, turn indicator, timer, health, and exit in one coherent system"
    - "Verify legibility from arm's length at phone, tablet, and laptop size"
  acceptance:
    - "HUD works in both presentations and all device classes"
    - "Arrangement is demonstrably not the reference app's"
    - "Readable at arm's length from both seats, verified with real people"
  labels: ["epic:originality", "epic:sdk", "epic:design", "type:feat", "priority:P1", "size:L", "needs-design"]
  milestone: M1 Playable Shell

- title: "Design the device-pairing moment as a signature interaction"
  epic: originality
  why: "Pairing a phone with a laptop is something the reference app cannot do at all. It is the moment most worth making memorable, and it is entirely ours to invent."
  actions:
    - "Design the pairing flow: create, share, join, both-ready, countdown"
    - "Make the join path work from a QR code, a short code, and a link, whichever is at hand"
    - "Design the moment both devices connect so it reads as a single shared event on both screens"
    - "Handle the waiting, failed, and expired states with the same care as the success path"
  acceptance:
    - "Two devices go from nothing to a started match in under thirty seconds"
    - "The connect moment is visibly designed, not a spinner disappearing"
    - "Every failure state explains what happened and what to do"
  labels: ["epic:originality", "epic:crossplay", "epic:design", "type:feat", "priority:P1", "size:L", "needs-design"]
  milestone: M2 Game Catalog

- title: "Design the tournament experience as our own"
  epic: originality
  why: "The format is worth adopting - seven random games and a running score is a genuinely good retention loop. The presentation of it should be ours."
  actions:
    - "Keep the format: a set of seven games with a running head-to-head score and a decisive end"
    - "Design our own progression visualisation rather than reproducing the node-track-and-trophy"
    - "Design the between-games beat: what the players see, and how the next game is introduced"
    - "Design the finale so winning a tournament feels like an event"
  acceptance:
    - "Progression is legible at a glance from both seats at any moment"
    - "The visualisation is not a linear node track with a trophy at the end"
    - "The finale is designed, not a score screen with different copy"
  labels: ["epic:originality", "epic:meta", "epic:design", "type:feat", "priority:P1", "size:L", "needs-design"]
  milestone: M1 Playable Shell

- title: "Design the pre-match screen and teach each game without words"
  epic: originality
  why: "The reference app states the rules in a sentence and offers a how-to-play video. A web product can do better: show the game moving before anyone commits to it."
  actions:
    - "Design a pre-match screen that communicates the game, its controls, and its win condition at a glance"
    - "Use a live or looping demonstration rather than a video the player must choose to watch"
    - "Show the control scheme for the device actually in hand, and for the chosen mode"
    - "Keep it fast - this screen sits between wanting to play and playing"
  acceptance:
    - "A first-time player understands the goal and the controls without reading a paragraph"
    - "The demonstration costs less than the game chunk it precedes"
    - "Layout is not the reference app's title-card-and-two-buttons arrangement"
  labels: ["epic:originality", "epic:site", "type:feat", "priority:P1", "size:M", "needs-design"]
  milestone: M1 Playable Shell

- title: "Design the game card"
  epic: originality
  why: "The card is the most repeated component on the site - 107 instances on one screen. Its design decides whether the catalog reads as ours or as a familiar grid."
  actions:
    - "Design the card to carry name, category, round length, supported modes, and offline availability without clutter"
    - "Give it a motion behaviour on hover and focus that shows the game rather than decorating the card"
    - "Design its loading, error, and offline-unavailable states"
    - "Ensure the composition is distinct from a square illustration with a title bar across the bottom"
  acceptance:
    - "Card communicates mode support and round length at a glance"
    - "Preview is under budget and falls back cleanly under reduced-motion and save-data"
    - "Composition is demonstrably not the reference app's"
  labels: ["epic:originality", "epic:design", "type:feat", "priority:P1", "size:M", "needs-design"]
  milestone: M1 Playable Shell

- title: "Define the motion and interaction signature"
  epic: originality
  why: "How a product moves is as recognisable as how it looks, and it is the layer most often left to defaults."
  actions:
    - "Define the signature transitions: entering a match, passing a turn, scoring, winning"
    - "Tie the motion language to the seam motif so movement reinforces identity"
    - "Specify what each motion becomes under reduced-motion - a state change, never nothing"
    - "Keep gameplay-critical feedback readable without any motion at all"
  acceptance:
    - "Motion tokens defined and used by both shell and games"
    - "Every signature motion has a reduced-motion equivalent"
    - "No gameplay information is conveyed by motion alone"
  labels: ["epic:originality", "epic:design", "epic:a11y", "type:spec", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

- title: "Define the sound identity"
  epic: originality
  why: "Sound is half the feel of a mini-game and the fastest thing to accidentally imitate. Ours must be composed, not sampled from anywhere."
  actions:
    - "Define the tonal palette: what scoring, winning, losing, and passing a turn sound like across the whole catalog"
    - "Design a short audio signature for match start and tournament victory"
    - "Ensure every sound is original or licensed with the licence recorded"
    - "Check nothing is recognisably derived from the reference app"
  acceptance:
    - "Sound set is coherent across games and original throughout"
    - "Licence recorded for every file and passing the CI check"
  labels: ["epic:originality", "epic:audio", "epic:legal", "type:spec", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

- title: "Write the interface voice guide"
  epic: originality
  why: "Copy is where a product's personality either exists or does not. Borrowed phrasing is as recognisable as a borrowed layout, and it is the cheapest thing to get right."
  actions:
    - "Define the voice in three adjectives with examples of what it is and is not"
    - "Write the core strings: buttons, empty states, errors, results, pairing prompts"
    - "Use the same verb from action through to confirmation"
    - "Check no string is lifted from the reference app"
  acceptance:
    - "Voice guide committed with real examples"
    - "No exclamation-mark filler, no 'Oops', no borrowed phrasing"
    - "Every user-facing string traces to the guide"
  labels: ["epic:originality", "epic:ui", "epic:docs", "type:spec", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

- title: "Run the originality review before launch"
  epic: originality
  why: "The differentiation brief is a promise made at the start; this is the check that it was kept. It is also the record that answers a complaint if one ever arrives."
  actions:
    - "Place our screens beside the reference app's equivalents and review each pair: landing, browse, pre-match, in-match, result, tournament"
    - "Confirm no layout, arrangement, colour pairing, icon, or string is a copy"
    - "Confirm every asset has a licence entry and no asset derives from another product"
    - "Record the review with evidence and sign it off"
  acceptance:
    - "Written review covering every screen pair with a verdict on each"
    - "Anything flagged is redesigned before launch, not noted and shipped"
    - "The review is filed as the standing answer to an originality challenge"
  labels: ["epic:originality", "epic:legal", "epic:qa", "type:qa", "priority:P1", "size:L"]
  milestone: M3 Premium Site

- title: "Design onboarding for a first-time pair"
  epic: originality
  why: "Two people who have never seen the site need to understand within seconds that this is for both of them, on this one device or on two. Nothing in the reference app solves this for the web."
  actions:
    - "Design the first-run moment: choose how you are playing before choosing what to play"
    - "Make the three configurations legible without jargon - one device together, two devices, or alone against a bot"
    - "Remember the choice and let it be changed at any time"
    - "Keep it skippable for anyone who arrived from search on a specific game"
  acceptance:
    - "A first-time visitor picks a configuration and reaches a match without instructions"
    - "Someone arriving from search on a game page is never blocked by onboarding"
  labels: ["epic:originality", "epic:site", "type:feat", "priority:P1", "size:M", "needs-design"]
  milestone: M1 Playable Shell

# =====================================================================
# E23 THE THREE PLAY CONFIGURATIONS, END TO END
# Single-player against a bot, two players on one device, and two players
# on two devices. Every one of them has to work everywhere, and the
# tournament has to work in all three.
# =====================================================================

- title: "Specify the three play configurations and how a player moves between them"
  epic: sdk
  why: "Single-player against a bot, two players sharing a device, and two players on separate devices are three different products wearing the same games. The rules for how they are chosen, remembered, and switched need deciding once."
  actions:
    - "Define the three configurations and what each implies for presentation, input, and netcode"
    - "Decide where the choice is made - globally, per game, or both - and how it is remembered"
    - "Specify what happens when a player switches configuration mid-session"
    - "Specify which configurations each archetype can support and how the manifest declares it"
  acceptance:
    - "Doc committed with a decision table per configuration"
    - "The choice survives navigation and reload"
    - "A game never offers a configuration it cannot support"
  labels: ["epic:sdk", "epic:crossplay", "type:spec", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Guarantee every two-player game ships a bot opponent"
  epic: sdk
  why: "Single-player means a bot sits opposite the human. A game without one is a dead end for anybody playing alone, and the reference app itself leaves at least one game with no bot at all."
  actions:
    - "Audit every game in the catalog for a bot implementation across all three difficulty tiers"
    - "Add bots where the reference app has none - Wheelie is the known case - rather than inheriting the gap"
    - "Exclude only the genuine single-player puzzles, which have no opponent by nature"
    - "Verify every bot through the balance harness"
  acceptance:
    - "Every two-player game offers Easy, Normal, and Hard"
    - "No two-player game presents a disabled or missing single-player option"
    - "The seven solo puzzles are explicitly exempt and marked as such"
  labels: ["epic:sdk", "type:chore", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Run tournaments in single-player against a bot"
  epic: meta
  why: "The tournament is the retention hook, and someone playing alone should not be locked out of it."
  actions:
    - "Support a seven-game tournament against a bot at a chosen difficulty"
    - "Keep the difficulty consistent across the run"
    - "Track solo tournament records separately from head-to-head records"
  acceptance:
    - "A full solo tournament completes with a decisive result"
    - "Difficulty is fixed for the run and shown throughout"
    - "Solo records never mix with two-player head-to-head records"
  labels: ["epic:meta", "type:feat", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

- title: "Run tournaments across two devices"
  epic: meta
  why: "A seven-game run is the best reason to stay connected, so it must survive the whole remote session rather than being a same-device-only feature."
  actions:
    - "Carry tournament state across the paired session with both clients agreed on score and next game"
    - "Handle a disconnect mid-tournament without losing the run"
    - "Let either player see the standing at any time"
  acceptance:
    - "A seven-game tournament completes across two device classes with a consistent score"
    - "A reconnect resumes at the correct game with the correct score"
  labels: ["epic:meta", "epic:crossplay", "type:feat", "priority:P2", "size:M"]
  milestone: M4 Online

- title: "Let a match change configuration without losing progress"
  epic: sdk
  why: "A pair sharing a phone will want to move to a laptop; someone playing a bot will want to hand the second seat to a person who just walked in. Forcing a restart makes the product feel brittle."
  actions:
    - "Support handing the second seat from bot to human and back between matches"
    - "Support moving an in-progress tournament from one device to a paired pair of devices"
    - "Define clearly what cannot be switched mid-match and prevent it rather than failing halfway"
  acceptance:
    - "Swapping the second seat between bot and human preserves the running score"
    - "Unsupported switches are prevented up front with a clear reason"
  labels: ["epic:sdk", "epic:meta", "type:feat", "priority:P3", "size:M"]
  milestone: M4 Online

# =====================================================================
# E24 SECURITY
# A games site with player-entered names, shareable rooms, embeddable
# iframes, and a public leaderboard has a real attack surface. Every
# issue here names the OWASP Top 10 category or CWE it closes.
# =====================================================================

- title: "Write the threat model and security requirements"
  epic: security
  why: "You cannot secure a system you have not described. Everything else in this epic is a mitigation for something this document names."
  actions:
    - "Map the trust boundaries: browser, edge, API, room server, database, ad and analytics third parties"
    - "Enumerate the assets worth attacking: player records, leaderboards, purchases, room sessions, and our domain reputation"
    - "Enumerate the actors: a curious player, a cheater, an automated scanner, a malicious embedder"
    - "Map each threat to an OWASP Top 10 category and a planned mitigation"
    - "State explicitly what we accept as out of scope for casual peer-to-peer play"
  acceptance:
    - "Threat model committed with a mitigation owner per threat"
    - "Every later security issue references a threat from this document"
    - "Reviewed and agreed before the backend work starts"
  labels: ["epic:security", "type:spec", "priority:P0", "size:L"]
  milestone: M1 Playable Shell

- title: "Write the secure coding standard for this codebase"
  epic: security
  why: "Generic advice does not change behaviour. The standard has to name the patterns this specific stack gets wrong."
  actions:
    - "Ban dangerouslySetInnerHTML, innerHTML, eval, new Function, and string-built SQL, enforced by lint"
    - "Require validated parsing at every trust boundary rather than trusting shapes"
    - "Require parameterised queries and typed query builders exclusively"
    - "Document the review checklist a reviewer runs against any change touching input, auth, or storage"
  acceptance:
    - "Standard committed and linked from CONTRIBUTING.md"
    - "The banned patterns fail lint rather than relying on reviewer memory"
    - "Reviewers have a concrete checklist, not a principle"
  labels: ["epic:security", "epic:docs", "type:spec", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Validate and sanitise every player-supplied string (A03 Injection, CWE-79)"
  epic: security
  why: "Player names, room codes, and chat-adjacent text end up in the DOM, in share images, in URLs, and in logs. Cross-site scripting is the single most likely vulnerability on a site like this."
  actions:
    - "Define a schema for every user-supplied field: length, allowed character classes, normalisation"
    - "Validate on input and encode contextually on output - HTML, attribute, URL, and canvas text each differ"
    - "Never interpolate user text into markup; render it as text nodes"
    - "Add tests using a standard XSS payload corpus against every field"
  acceptance:
    - "Every user-supplied field has a schema enforced server-side, not only in the browser"
    - "The XSS payload corpus produces no execution anywhere, including in share images"
    - "Unicode direction-override and zero-width characters are normalised out of display names"
  labels: ["epic:security", "type:feat", "priority:P0", "size:L"]
  milestone: M2 Game Catalog

- title: "Enforce authorisation on every API route (A01 Broken Access Control, CWE-639)"
  epic: security
  why: "Broken access control is the most commonly exploited category on the web. Rooms, saves, and profiles are all addressable by identifier, which is exactly the shape of an IDOR."
  actions:
    - "Require an explicit authorisation decision in every handler; make the default deny"
    - "Use unguessable identifiers for rooms and saves rather than sequential ones"
    - "Verify ownership server-side on every read and write, never trusting a client-supplied identity"
    - "Add tests that attempt cross-account access on every route and expect a refusal"
  acceptance:
    - "No route reaches data without an authorisation check, verified by test"
    - "Cross-account access attempts fail on every route in the suite"
    - "Identifiers are unguessable and not enumerable"
  labels: ["epic:security", "epic:backend", "type:feat", "priority:P0", "size:L"]
  milestone: M4 Online

- title: "Parameterise all database access and constrain the ORM (A03 Injection, CWE-89)"
  epic: security
  why: "One string-concatenated query is all it takes, and the leaderboard is the obvious target."
  actions:
    - "Use parameterised statements or a typed query builder exclusively"
    - "Ban raw query interpolation in lint and in review"
    - "Grant the application database role only the privileges it actually needs"
    - "Add injection tests against every parameterised endpoint"
  acceptance:
    - "No raw interpolated SQL anywhere in the codebase"
    - "The application role cannot drop or alter schema"
    - "Injection test suite passes against every data endpoint"
  labels: ["epic:security", "epic:backend", "type:feat", "priority:P0", "size:M"]
  milestone: M4 Online

- title: "Harden the room server and signalling against abuse (A04 Insecure Design)"
  epic: security
  why: "An open WebSocket that creates rooms on demand is a free resource for anyone who wants to exhaust it, and a way into other people's matches if messages are not authorised."
  actions:
    - "Authorise every message against the sender's membership of that room"
    - "Cap rooms per identity, messages per second, and payload size"
    - "Validate every inbound message against a schema and drop malformed frames without crashing"
    - "Expire idle rooms and cap room lifetime"
  acceptance:
    - "A client cannot send into a room it has not joined"
    - "Flooding a connection results in throttling and disconnection, never server degradation"
    - "Malformed frames are dropped and logged rather than throwing"
  labels: ["epic:security", "epic:online", "type:feat", "priority:P1", "size:L"]
  milestone: M4 Online

- title: "Protect against prototype pollution and unsafe deserialisation (CWE-1321, CWE-502)"
  epic: security
  why: "This is the JavaScript-specific one people forget. Game state, replays, and network messages are all deserialised, and a crafted key can poison Object.prototype across the whole runtime."
  actions:
    - "Reject __proto__, constructor, and prototype keys when parsing any external JSON"
    - "Use null-prototype objects or Maps for anything built from external input"
    - "Validate deserialised game state and replay traces against a schema before use"
    - "Add tests with known pollution payloads against every parsing path"
  acceptance:
    - "Pollution payloads cannot alter Object.prototype through any input path"
    - "Saved state and replays are schema-validated before being applied"
  labels: ["epic:security", "epic:engine", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Secure the embeddable iframe and postMessage surface (CWE-1021, CWE-346)"
  epic: security
  why: "We deliberately let other sites embed our games, which means we ship a clickjacking and message-injection surface on purpose. It has to be built with that in mind."
  actions:
    - "Serve the embed route with a sandbox and a frame-ancestors policy driven by an allowlist"
    - "Verify origin on every postMessage received and never use a wildcard target origin when sending"
    - "Keep the embed route free of any authenticated or personal data"
    - "Set frame-ancestors to none on every non-embed route"
  acceptance:
    - "Only allowlisted origins can frame the embed route"
    - "Messages from unexpected origins are ignored"
    - "No non-embed route can be framed at all"
  labels: ["epic:security", "epic:seo", "type:feat", "priority:P1", "size:M"]
  milestone: M4 Online

- title: "Enforce a strict Content Security Policy with nonces (A05 Security Misconfiguration)"
  epic: security
  why: "CSP is the backstop for the cross-site scripting we hope we already prevented, and an ad-serving games site badly needs a backstop."
  actions:
    - "Nonce-based script-src with no unsafe-inline and no unsafe-eval"
    - "Allowlist only the third-party origins actually required, reviewed each time one is added"
    - "Set object-src none, base-uri self, and form-action self"
    - "Ship report-only first, collect reports, then enforce"
  acceptance:
    - "Enforced CSP with zero violations across every route"
    - "Adding a third-party script requires an explicit, reviewed policy change"
  labels: ["epic:security", "epic:setup", "type:chore", "priority:P1", "size:M"]
  milestone: M3 Premium Site

- title: "Set the full security header suite (A05 Security Misconfiguration)"
  epic: security
  why: "These are cheap, well-understood protections, and their absence is the first thing any scanner reports."
  actions:
    - "HSTS with a long max-age and preload, X-Content-Type-Options, Referrer-Policy, Permissions-Policy"
    - "Cross-Origin-Opener-Policy and Cross-Origin-Resource-Policy"
    - "Verify with an external scanner and record the grade"
    - "Add a test that fails if a header is dropped"
  acceptance:
    - "Grade A on an external header scan"
    - "A removed header fails CI rather than being noticed later"
  labels: ["epic:security", "epic:setup", "type:chore", "priority:P1", "size:S"]
  milestone: M3 Premium Site

- title: "Keep secrets out of the client bundle (CWE-798)"
  epic: security
  why: "Anything shipped to the browser is public. On a site with ads, analytics, and a backend it is genuinely easy to leak a key into a bundle by accident."
  actions:
    - "Separate public configuration from secrets by naming convention and enforce it in the build"
    - "Scan built bundles for high-entropy strings and known key formats in CI"
    - "Document the rotation procedure for each secret"
    - "Fail the build when a secret-shaped string reaches client output"
  acceptance:
    - "A deliberately planted key fails the build"
    - "No credential appears in any shipped asset"
    - "Rotation is documented and has been rehearsed once"
  labels: ["epic:security", "epic:setup", "type:chore", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Secure the dependency supply chain (A06, A08, CWE-1104)"
  epic: security
  why: "A games site pulls in a lot of npm, and a compromised transitive dependency is the most realistic route to serving malware from our domain to five million people."
  actions:
    - "Commit a lockfile and enable install-time integrity verification"
    - "Run dependency and advisory scanning on every PR and nightly"
    - "Pin CI actions to commit SHAs rather than moving tags"
    - "Review any new direct dependency for maintenance status and transitive weight before adding it"
  acceptance:
    - "A high-severity advisory fails the build"
    - "CI actions are SHA-pinned"
    - "Adding a direct dependency requires a recorded review"
  labels: ["epic:security", "epic:setup", "type:chore", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Add SAST, secret scanning, and dependency review to CI"
  epic: security
  why: "Automated checks catch the regressions a one-off audit cannot, and they run on every change rather than once a year."
  actions:
    - "Enable static analysis with security rules and fail on high severity"
    - "Enable secret scanning with push protection"
    - "Add a scheduled full scan in addition to per-PR scanning"
    - "Route findings to a triage label with an owner"
  acceptance:
    - "A deliberately introduced vulnerable pattern fails CI"
    - "Findings land in triage rather than an ignored dashboard"
  labels: ["epic:security", "epic:qa", "type:chore", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Add DAST scanning against a preview deployment"
  epic: security
  why: "Static analysis cannot see misconfiguration, missing headers, or an exposed route. A running scan can."
  actions:
    - "Run an automated scanner against each preview deploy"
    - "Cover the shell routes, the API, and the embed route"
    - "Fail on high severity and triage the rest"
  acceptance:
    - "Scan runs automatically per release candidate"
    - "High-severity findings block release"
  labels: ["epic:security", "epic:qa", "type:chore", "priority:P2", "size:M"]
  milestone: M3 Premium Site

- title: "Secure authentication and session handling (A07, CWE-287)"
  epic: security
  why: "Accounts are optional here, which limits the blast radius, but the accounts that do exist carry purchases and leaderboard standing."
  actions:
    - "Delegate authentication to a vetted OAuth provider rather than storing passwords"
    - "Issue short-lived tokens with rotation and server-side revocation"
    - "Use SameSite and Secure cookie attributes and bind sessions to a device fingerprint that carries no personal data"
    - "Rate limit and lock out credential-stuffing patterns"
  acceptance:
    - "No password is ever stored by us"
    - "A stolen token expires quickly and can be revoked server-side"
    - "Automated credential stuffing is throttled and alerted"
  labels: ["epic:security", "epic:backend", "type:feat", "priority:P1", "size:L"]
  milestone: M4 Online

- title: "Treat every client-submitted score as an untrusted claim (A08, CWE-345)"
  epic: security
  why: "The leaderboard is the one place where lying is rewarded. Client-side scores are assertions, not facts."
  actions:
    - "Validate submissions against physically achievable bounds derived from the balance harness"
    - "Require a signed, replayable input trace for any score that reaches a public board"
    - "Re-simulate submitted traces server-side for top entries"
    - "Flag rather than silently drop suspicious submissions, and rate limit per identity"
  acceptance:
    - "A fabricated score is rejected and logged"
    - "Top-of-board entries are verified by re-simulation"
    - "Assist-mode runs never reach a competitive board"
  labels: ["epic:security", "epic:backend", "type:feat", "priority:P1", "size:L"]
  milestone: M4 Online

- title: "Prevent SSRF in any server-side fetch (A10, CWE-918)"
  epic: security
  why: "Share cards, OG image generation, and any future webhook all fetch on the server's behalf, which is exactly the shape of a server-side request forgery."
  actions:
    - "Allowlist destinations for every server-side fetch"
    - "Block private, link-local, and metadata address ranges after DNS resolution"
    - "Disable redirect following or re-validate the destination after each hop"
    - "Set aggressive timeouts and response size caps"
  acceptance:
    - "Requests to internal ranges are refused even via redirect or DNS rebinding"
    - "Every server-side fetch has an explicit allowlist"
  labels: ["epic:security", "epic:backend", "type:feat", "priority:P2", "size:M"]
  milestone: M4 Online

- title: "Guard against ReDoS and algorithmic complexity attacks (CWE-1333, CWE-400)"
  epic: security
  why: "One catastrophically backtracking regular expression in a search field takes down a node process, and we have a search field over 107 games."
  actions:
    - "Audit every regular expression that touches user input for backtracking behaviour"
    - "Replace risky patterns with linear-time parsing or a safe engine"
    - "Bound input length before any pattern is applied"
    - "Add tests with known pathological inputs"
  acceptance:
    - "No user-facing pattern exhibits super-linear behaviour on the pathological corpus"
    - "Input length is bounded before matching"
  labels: ["epic:security", "type:feat", "priority:P2", "size:M"]
  milestone: M3 Premium Site

- title: "Implement security logging, alerting, and an incident runbook (A09)"
  epic: security
  why: "The failure mode that hurts most is not being attacked, it is being attacked for a week without noticing."
  actions:
    - "Log authorisation failures, rate-limit trips, validation rejections, and admin actions"
    - "Never log tokens, secrets, or personal data"
    - "Alert on anomalous patterns rather than individual events"
    - "Write the incident runbook covering triage, containment, disclosure, and rotation"
  acceptance:
    - "Security events are queryable and retained for a defined period"
    - "No secret or personal datum appears in any log"
    - "The runbook has been walked through once as a tabletop exercise"
  labels: ["epic:security", "epic:backend", "type:feat", "priority:P1", "size:M"]
  milestone: M3 Premium Site

- title: "Cover the CWE/SANS Top 25 with a mapped verification matrix"
  epic: security
  why: "OWASP categories are broad. The CWE Top 25 is specific enough to check off one by one, and a matrix is what turns 'we care about security' into evidence."
  actions:
    - "Produce a matrix of the CWE Top 25 against this codebase"
    - "For each entry record: applicable or not, the mitigation, and the test that proves it"
    - "File an issue for every entry that is applicable and unmitigated"
    - "Re-verify the matrix each release"
  acceptance:
    - "Every applicable CWE has a named mitigation and an automated test"
    - "Entries marked not applicable carry a written justification"
  labels: ["epic:security", "epic:qa", "type:qa", "priority:P1", "size:L"]
  milestone: M3 Premium Site

- title: "Commission an external penetration test before launch"
  epic: security
  why: "We will not find our own blind spots, and five million users is past the point where an internal review alone is responsible."
  actions:
    - "Scope the test across the shell, API, room server, embed route, and payment flow"
    - "Fix all high and critical findings before launch and re-test them"
    - "Record accepted risks with a named owner and a review date"
  acceptance:
    - "Report received and every high or critical finding fixed and re-tested"
    - "Accepted risks are documented rather than forgotten"
  labels: ["epic:security", "type:qa", "priority:P2", "size:L"]
  milestone: M3 Premium Site

- title: "Publish a vulnerability disclosure policy and security contact"
  epic: security
  why: "Researchers will find things. Without a route to report them, the next best option they have is publishing."
  actions:
    - "Publish security.txt and a disclosure policy with response time commitments"
    - "Define the internal triage path and who owns it"
    - "State clearly what is in scope and what is not"
  acceptance:
    - "security.txt is served and the policy is reachable"
    - "A test report reaches a named owner within the stated window"
  labels: ["epic:security", "epic:legal", "type:chore", "priority:P2", "size:S"]
  milestone: M3 Premium Site

# =====================================================================
# E25 SCALE AND RELIABILITY - FIVE MILLION USERS
# Capacity, cost, and failure behaviour at the target user base.
# =====================================================================

- title: "Model capacity and cost at five million users"
  epic: scale
  why: "Five million registered users implies a peak concurrency, a bandwidth bill, and a database load that must be sized before the architecture is fixed, not after the invoice arrives."
  actions:
    - "Derive peak concurrent sessions, matches per second, and room churn from the target user base"
    - "Size bandwidth from the real asset payload per session, including game chunks and previews"
    - "Model cost per million sessions for CDN, edge compute, database, and TURN relay"
    - "Identify the first component that breaks as load grows and state the mitigation"
  acceptance:
    - "Written capacity model with stated assumptions and a cost per million sessions"
    - "The first bottleneck is named with a plan, not discovered in production"
  labels: ["epic:scale", "epic:backend", "type:spec", "priority:P1", "size:L"]
  milestone: M3 Premium Site

- title: "Define service level objectives and an error budget"
  epic: scale
  why: "Without an SLO, every incident is argued from opinion and every performance regression is somebody's judgement call."
  actions:
    - "Set availability, latency, and Core Web Vitals objectives for the shell, the API, and the room server"
    - "Define the error budget and what happens when it is spent"
    - "Instrument each objective so it is measured, not estimated"
  acceptance:
    - "SLOs committed, measured, and visible on a dashboard"
    - "Burning the error budget has an agreed, written consequence"
  labels: ["epic:scale", "epic:analytics", "type:spec", "priority:P2", "size:M"]
  milestone: M3 Premium Site

- title: "Make the frontend fully static and edge-cached"
  epic: scale
  why: "At this scale the cheapest and most reliable request is the one served from cache at the edge and never touches an origin."
  actions:
    - "Statically generate every content route and serve from the edge"
    - "Content-hash all assets with long immutable caching and short HTML caching"
    - "Verify cache hit ratio under load and tune what misses"
    - "Ensure a cold origin cannot be stampeded by a cache purge"
  acceptance:
    - "Cache hit ratio above the agreed threshold under load test"
    - "A purge does not overwhelm the origin"
  labels: ["epic:scale", "epic:perf", "type:feat", "priority:P1", "size:M"]
  milestone: M3 Premium Site

- title: "Design the room server to scale horizontally"
  epic: scale
  why: "The room server is the only genuinely stateful component, which makes it the one that will not scale by adding instances unless it was designed to."
  actions:
    - "Keep room state in a shared store rather than in process memory, or shard rooms deterministically"
    - "Make instances interchangeable so any can serve any room"
    - "Drain connections gracefully on deploy so a release does not end live matches"
    - "Autoscale on connection count rather than CPU alone"
  acceptance:
    - "Adding an instance increases capacity approximately linearly"
    - "A rolling deploy does not drop live matches"
  labels: ["epic:scale", "epic:online", "type:feat", "priority:P2", "size:L"]
  milestone: M4 Online

- title: "Load test to the modelled peak and beyond"
  epic: scale
  why: "A capacity model is a hypothesis until it is tested, and the interesting behaviour is always just past the expected peak."
  actions:
    - "Load test the shell, the API, and the room server to the modelled peak and then to failure"
    - "Record the failure mode at each tier - degradation is acceptable, collapse is not"
    - "Test the realistic mix: mostly browsing, some matches, a few tournaments"
    - "Re-run before each major release"
  acceptance:
    - "Modelled peak sustained with objectives met"
    - "Behaviour past peak is graceful degradation, documented per tier"
  labels: ["epic:scale", "epic:qa", "type:qa", "priority:P2", "size:L"]
  milestone: M4 Online

- title: "Implement rate limiting and DDoS protection at the edge"
  epic: scale
  why: "A popular games site attracts scrapers and stress-testers, and absorbing that at the edge is far cheaper than at the origin."
  actions:
    - "Rate limit per IP and per identity at the edge with clear 429 responses and a Retry-After"
    - "Apply stricter limits to expensive endpoints: room creation, score submission, share-image generation"
    - "Enable managed DDoS protection and bot filtering"
    - "Ensure legitimate players never trip the limits during normal play"
  acceptance:
    - "Abusive traffic is absorbed at the edge without origin impact"
    - "No normal play pattern trips a limit, verified against real session traces"
  labels: ["epic:scale", "epic:security", "epic:backend", "type:feat", "priority:P1", "size:M"]
  milestone: M3 Premium Site

- title: "Design the database for scale: indexing, pooling, and read replicas"
  epic: scale
  why: "Leaderboards and saves are read overwhelmingly more than they are written, and an unindexed leaderboard query is the classic way to take a site down at peak."
  actions:
    - "Index every query path and verify with query plans against realistic data volumes"
    - "Serve leaderboard reads from replicas or a cache rather than the primary"
    - "Use connection pooling sized to the serverless concurrency model"
    - "Define retention and archival so tables do not grow without bound"
  acceptance:
    - "No query path performs a sequential scan at production data volumes"
    - "Leaderboard reads never touch the primary"
    - "Connection exhaustion is not reachable under load test"
  labels: ["epic:scale", "epic:backend", "type:feat", "priority:P2", "size:L"]
  milestone: M4 Online

- title: "Implement graceful degradation for every dependency"
  epic: scale
  why: "At five million users something is always partly broken. The site must stay playable when the leaderboard, ad network, or analytics is not."
  actions:
    - "Identify every external dependency and define the degraded behaviour when it fails"
    - "Apply timeouts, circuit breakers, and bounded retries to each"
    - "Guarantee local play works with the entire backend unavailable"
    - "Test each degraded path by deliberately failing the dependency"
  acceptance:
    - "Local two-player games remain fully playable with the backend down"
    - "No single third-party failure takes the site down, verified by fault injection"
  labels: ["epic:scale", "epic:backend", "type:feat", "priority:P1", "size:L"]
  milestone: M3 Premium Site

- title: "Set up observability: tracing, metrics, and structured logs"
  epic: scale
  why: "At this scale a report of 'the game feels slow' is unactionable without the data to locate it."
  actions:
    - "Trace requests across edge, API, and room server with a correlation identifier"
    - "Emit metrics for the SLOs and for saturation of each tier"
    - "Use structured logs with sampling so volume stays affordable"
    - "Build the dashboard someone actually opens during an incident"
  acceptance:
    - "A slow request can be traced end to end from a single identifier"
    - "Saturation is visible per tier before it becomes an outage"
    - "Log cost is bounded by sampling"
  labels: ["epic:scale", "epic:backend", "type:feat", "priority:P2", "size:L"]
  milestone: M3 Premium Site

- title: "Write the on-call and incident response process"
  epic: scale
  why: "Five million users means an outage is noticed by a lot of people very quickly, and improvising the response is how a short incident becomes a long one."
  actions:
    - "Define severity levels, escalation, and communication channels"
    - "Write runbooks for the likely incidents: room server saturation, database exhaustion, bad deploy, CDN failure"
    - "Establish a blameless post-incident review with tracked actions"
  acceptance:
    - "Runbooks exist for each named scenario and have been rehearsed"
    - "Post-incident actions are tracked as issues, not lost in a document"
  labels: ["epic:scale", "epic:docs", "type:chore", "priority:P2", "size:M"]
  milestone: M3 Premium Site

- title: "Implement backup, restore, and disaster recovery with tested targets"
  epic: scale
  why: "An untested backup is a hypothesis. Losing five million players' records would be unrecoverable as a product, not just as data."
  actions:
    - "Automate backups with point-in-time recovery"
    - "Define and agree recovery point and recovery time objectives"
    - "Rehearse a full restore into a clean environment and time it"
    - "Document the runbook from the rehearsal"
  acceptance:
    - "A full restore has been performed and timed against the objectives"
    - "The runbook was written from an actual rehearsal, not from memory"
  labels: ["epic:scale", "epic:backend", "type:chore", "priority:P2", "size:M"]
  milestone: M4 Online

- title: "Enforce a per-session asset budget at catalog scale"
  epic: scale
  why: "107 games of thumbnails and previews is where bandwidth cost and mobile data usage both get decided, and both matter at five million users."
  actions:
    - "Budget bytes per session for the catalog view specifically"
    - "Lazy-load and prioritise only what is on screen"
    - "Serve modern formats with correct sizing per device class"
    - "Track real bandwidth per session in field data, not just lab measurements"
  acceptance:
    - "Catalog view stays within the per-session byte budget on a phone"
    - "Field data confirms the budget holds in practice"
  labels: ["epic:scale", "epic:perf", "type:feat", "priority:P2", "size:M"]
  milestone: M3 Premium Site

# =====================================================================
# E26 CONTROLS ACROSS CONFIGURATIONS
# Two players sharing a laptop both need the keyboard. One player alone
# should be able to use the keyboard, the mouse, or both, whichever
# suits the game and the moment.
# =====================================================================

- title: "Make the keyboard a first-class control for shared-device two-player play"
  epic: input
  why: "Two people sharing a laptop have one keyboard and no touchscreen. If the keyboard is an afterthought, the whole desktop experience of a two-player site is an afterthought."
  actions:
    - "Define default two-player bindings that split the keyboard into two comfortable, non-overlapping halves - the left hand around WASD with a nearby action key, the right hand on the arrows with its own action key"
    - "Guarantee both halves register simultaneously, including diagonal movement on both sides at once"
    - "Document the known n-key rollover and ghosting limits of common keyboards and choose defaults that avoid the worst combinations"
    - "Prevent browser and OS shortcuts from firing during a match without trapping the player in the page"
    - "Show both players' bindings on screen before the match and on demand during it"
  acceptance:
    - "Both players can hold a direction and press their action key at the same time with no dropped input, verified on at least three physical keyboards"
    - "No default binding collides with a common browser shortcut"
    - "Escape always reaches the pause menu and is never swallowed"
    - "Every game declares its two-player keyboard scheme in the manifest"
  labels: ["epic:input", "epic:crossplay", "type:feat", "priority:P0", "size:L"]
  milestone: M1 Playable Shell

- title: "Support keyboard and mouse independently in single-player"
  epic: input
  why: "Alone, a player has the whole keyboard and a pointer. Some games are better aimed with a mouse and others better driven with keys, and the player should not have to care which we prefer."
  actions:
    - "Map every game action to both a keyboard control and a pointer control for single-seat play"
    - "Allow either to be used at any moment without a mode switch - moving the mouse after using keys must not fight the player"
    - "Define the pointer idiom per archetype: click-drag-release to aim, click to place, hold to charge, pointer position to steer"
    - "Keep keyboard-only play fully viable for every game, since not every player has or wants a mouse"
  acceptance:
    - "Every game is completable in single-player using only the keyboard"
    - "Every game is completable in single-player using only the pointer, where the archetype allows it"
    - "Switching between them mid-match is seamless and never drops an input"
  labels: ["epic:input", "type:feat", "priority:P0", "size:L"]
  milestone: M1 Playable Shell

- title: "Detect the active input method and adapt hints without changing behaviour"
  epic: input
  why: "Showing keyboard prompts to someone using a mouse, or touch prompts on a laptop, is the small detail that makes an interface feel unconsidered."
  actions:
    - "Track the most recently used input method and update on-screen prompts to match"
    - "Switch prompts on use, never on device sniffing"
    - "Keep every control active regardless of which prompt is showing"
    - "Handle hybrid devices - a touchscreen laptop, a tablet with a keyboard - without flickering between prompt sets"
  acceptance:
    - "Prompts follow the input the player actually used most recently"
    - "No input path is ever disabled because another was detected"
    - "Hybrid devices do not flicker between prompt sets"
  labels: ["epic:input", "epic:ui", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Define the pointer control idiom per archetype"
  epic: input
  why: "Deciding what a mouse does in an aim game once means 21 aim games behave consistently instead of 21 slightly different ways."
  actions:
    - "Specify the pointer idiom for each archetype: turn-board, turn-aim, rt-split, rt-arena, rt-race"
    - "Define hover, press, drag, release, and cancel semantics for each"
    - "Specify the cursor treatment and when the pointer should be hidden during play"
    - "Verify each idiom works identically with a trackpad"
  acceptance:
    - "Every archetype has a documented pointer idiom used by all its games"
    - "Trackpad behaviour matches mouse behaviour"
    - "Drag can always be cancelled without committing an action"
  labels: ["epic:input", "type:spec", "priority:P1", "size:M"]
  milestone: M1 Playable Shell

- title: "Let both players rebind their own keys independently"
  epic: input
  why: "Default bindings assume a QWERTY layout and two right-handed people. Neither assumption is safe, and on a shared keyboard a bad binding affects both players."
  actions:
    - "Provide per-seat rebinding with live conflict detection against the other seat"
    - "Refuse a binding that collides with the other player or with a reserved system key"
    - "Detect non-QWERTY layouts and offer sensible defaults per layout"
    - "Persist per seat and offer a reset"
  acceptance:
    - "One key can never be bound to both seats"
    - "Non-QWERTY layouts get workable defaults without manual rebinding"
    - "Bindings persist and can be reset"
  labels: ["epic:input", "epic:a11y", "type:feat", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

- title: "Verify control parity between input methods per archetype"
  epic: input
  why: "If the mouse aims better than the keyboard in the same game, single-player results are decided by peripheral choice rather than skill - the same fairness problem as cross-device, one device in."
  actions:
    - "Measure outcomes for the same game played with keyboard only and pointer only"
    - "Bring any significant gap inside tolerance by adjusting the weaker path rather than degrading the stronger"
    - "Record the measured comparison per archetype"
  acceptance:
    - "Measured outcome distributions are comparable between keyboard-only and pointer-only play"
    - "Any residual difference is documented per archetype"
  labels: ["epic:input", "epic:qa", "type:qa", "priority:P2", "size:M"]
  milestone: M2 Game Catalog

# =====================================================================
# E27 ZERO-COST HOSTING
# The game runs on the player's device, not ours. Every match is simulated
# in their browser on their compute; our server's whole job is to hand over
# static bytes once and then get out of the way. That is both the cheapest
# way to run a games site and, for a fixed-timestep local game, the fastest.
# The point of this epic is to keep it true as features arrive.
# =====================================================================

- title: "Commit to a static-first hosting target and write down the cost model"
  epic: zero-cost
  why: "A games site that needs a server per match cannot be run on a small budget. Deciding now that the browser does the computing, and that the origin only ever serves files, is what keeps the bill near zero as the catalogue grows."
  actions:
    - "Choose a static host with no per-request billing and generous free bandwidth, and record why over the alternatives"
    - "Write the cost model: bytes per first session, bytes per repeat session, and the monthly total at 10k, 100k and 1M sessions"
    - "State the rule plainly: local play - one device, or one player against a bot - must cost zero requests after the first load"
    - "Identify the only things that can ever cost money and cap each: signalling, relay, and error reporting"
  acceptance:
    - "ADR committed naming the host, the cost model and the free-tier limits"
    - "Local play is proven to need no origin request after first load"
    - "Every paid dependency has a named cap and a documented behaviour when the cap is hit"
  labels: ["epic:zero-cost", "epic:backend", "type:spec", "priority:P0", "size:M"]
  milestone: M1 Playable Shell

- title: "Pre-render every route at build time with no request-time compute"
  epic: zero-cost
  why: "Server-side rendering per request is a bill that scales with popularity. Static generation turns 107 game pages into 107 files a CDN serves for nothing, and it is better for search anyway."
  actions:
    - "Generate every content route statically at build: landing, catalogue, category hubs, and one page per game"
    - "Ban request-time server rendering in the build config, and fail the build if a route opts into it"
    - "Read the catalogue from data at build time rather than from an API at runtime"
    - "Confirm the deployed output is a directory of files with no server runtime"
  acceptance:
    - "The whole site deploys as static files with no server process"
    - "Adding a dynamic route fails the build with a clear message"
    - "Every game page is in view-source without JavaScript"
  labels: ["epic:zero-cost", "epic:seo", "type:feat", "priority:P0", "size:M"]
  milestone: M3 Premium Site

- title: "Make the second play of a game cost zero requests"
  epic: zero-cost
  why: "The service worker is the difference between paying for every play and paying for the first one. Once a game's chunk is in the player's cache, every later match is free to us and instant for them."
  actions:
    - "Precache the app shell; cache each game chunk and its assets on first play"
    - "Serve cached games from the cache first, revalidating in the background"
    - "Verify with the network panel that a repeat play issues no origin request at all"
    - "Keep the cache versioned so a deploy does not strand a player on mixed versions"
  acceptance:
    - "A repeat play of a cached game issues zero network requests, verified in a test"
    - "A previously played game starts with the network disabled"
    - "A deploy migrates the cache without a hard reload"
  labels: ["epic:zero-cost", "epic:pwa", "type:feat", "priority:P1", "size:L"]
  milestone: M3 Premium Site

- title: "Set and enforce a per-session byte budget"
  epic: zero-cost
  why: "On a static host, bandwidth is the only meaningful cost, so bytes per session IS the hosting bill. It is also the player's mobile data, which makes it worth controlling twice over."
  actions:
    - "Budget bytes for a first session (shell plus one game) and for a browsing session"
    - "Fail CI when a change pushes either budget over"
    - "Prefer generated vector art and CSS over bitmaps wherever it holds up"
    - "Track real per-session bytes in field data, not just the lab number"
  acceptance:
    - "Budgets committed and enforced in CI, not aspirational"
    - "A first session on a phone stays within the agreed budget"
  labels: ["epic:zero-cost", "epic:perf", "type:chore", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Keep all gameplay computation on the player's device"
  epic: zero-cost
  why: "The simulation, the bots and the physics all run in the browser. This is what makes the site nearly free to host, and it also removes a round trip from every input - so it is better for the player, not a compromise."
  actions:
    - "Confirm no gameplay path calls the network: simulation, bot decisions, scoring and win conditions are all local"
    - "Budget bot thinking time so a hard bot on a low-end phone still holds the frame rate"
    - "Move any expensive search - minimax, pathfinding - off the render path, using a worker or a time-sliced budget per step"
    - "Add a test that a full local match completes with the network blocked entirely"
  acceptance:
    - "A full local match completes with the network disabled"
    - "No gameplay module imports a network client"
    - "The hardest bot holds the frame budget on the slowest device in the matrix"
  labels: ["epic:zero-cost", "epic:engine", "type:feat", "priority:P0", "size:M"]
  milestone: M2 Game Catalog

- title: "Store all player data locally, with no database in v1"
  epic: zero-cost
  why: "Head-to-head records, favourites, settings and personal bests belong to the device that made them. Keeping them local costs nothing to run, needs no account, and removes an entire class of privacy obligation."
  actions:
    - "Keep records, favourites, settings and stats in local storage under a versioned schema"
    - "Handle corrupt or foreign data by resetting to defaults rather than throwing"
    - "Offer export and import so a player can move devices without an account"
    - "Design the shape so a future optional sync can adopt it without a migration"
  acceptance:
    - "Every feature through M3 works with no backend at all"
    - "Corrupt storage never breaks a launch"
    - "A player can carry their record to another device without signing in"
  labels: ["epic:zero-cost", "epic:meta", "type:feat", "priority:P1", "size:M"]
  milestone: M2 Game Catalog

- title: "Make cross-device play peer-to-peer so matches do not touch our servers"
  epic: zero-cost
  why: "This is the one feature that could carry a real bill. If the two browsers talk directly, we pay only for the handshake; if traffic relays through us, we pay for every packet of every match."
  actions:
    - "Carry all match traffic over a WebRTC data channel between the two browsers"
    - "Keep signalling to the smallest possible exchange - offer, answer, candidates - and nothing after the connection is up"
    - "Measure what share of connections succeed peer-to-peer versus needing a relay, on real mobile networks"
    - "Never route gameplay through an origin server as a convenience"
  acceptance:
    - "A connected match sends no gameplay traffic to our infrastructure"
    - "The peer-to-peer success rate is measured and recorded, not assumed"
  labels: ["epic:zero-cost", "epic:crossplay", "type:feat", "priority:P1", "size:L"]
  milestone: M4 Online

- title: "Run signalling on a free-tier serverless function with hard limits"
  epic: zero-cost
  why: "Two browsers cannot find each other unaided, so a small brokering step is unavoidable. It should be the only compute we run, it should be brief, and it must not become an open door."
  actions:
    - "Implement signalling as a single stateless function: create a room, exchange offer and answer, then close"
    - "Hold room state in an ephemeral store with a short expiry rather than a database"
    - "Rate limit room creation per address and cap concurrent rooms"
    - "Shed load gracefully when the free tier is exhausted: explain, and offer local play or the bot"
  acceptance:
    - "A room's whole lifetime is a handful of small requests"
    - "Exhausting the quota degrades to a clear message, never a broken page"
    - "No gameplay message ever passes through the function"
  labels: ["epic:zero-cost", "epic:online", "type:feat", "priority:P2", "size:L"]
  milestone: M4 Online

- title: "Decide the relay policy before it becomes a bill"
  epic: zero-cost
  why: "A share of mobile networks block peer-to-peer, and relaying their traffic is metered by the gigabyte. That is the single most likely way this project acquires an unaffordable invoice."
  actions:
    - "Measure how often a relay is actually needed across real networks"
    - "Model the cost per relayed match-minute at realistic volumes"
    - "Decide the policy: no relay at all with an honest message, a capped free allowance, or a paid tier - and write down the reasoning"
    - "If relaying is offered, cap it globally and per match, and fall back cleanly when the cap is reached"
  acceptance:
    - "Written policy with the measured relay rate and modelled cost behind it"
    - "A player who cannot connect gets a clear explanation and a working alternative"
    - "No configuration exists in which relay spending is unbounded"
  labels: ["epic:zero-cost", "epic:online", "type:spec", "priority:P1", "size:M"]
  milestone: M4 Online

- title: "Guarantee the site degrades to local play when anything paid is unavailable"
  epic: zero-cost
  why: "Every paid dependency will eventually be exhausted, throttled or down. On a free-tier budget that is a normal Tuesday, not an incident, so the product has to be designed for it."
  actions:
    - "Enumerate every paid or metered dependency and its degraded behaviour"
    - "Guarantee local two-player and bot play work with all of them unavailable"
    - "Show an honest, specific message rather than a spinner when a remote feature is off"
    - "Test each degraded path by deliberately disabling the dependency"
  acceptance:
    - "The site is fully playable locally with every external service disabled"
    - "Each degraded path is verified by fault injection, not by inspection"
  labels: ["epic:zero-cost", "epic:scale", "type:feat", "priority:P1", "size:M"]
  milestone: M3 Premium Site

- title: "Generate share images and previews at build time, never on request"
  epic: zero-cost
  why: "On-demand image generation is compute per request, which is exactly what this architecture avoids. There are 107 games and their cards do not change between deploys."
  actions:
    - "Generate the social card for every game and category page during the build"
    - "Render the post-match share image in the player's browser on canvas rather than on a server"
    - "Keep every generated image inside the byte budget"
  acceptance:
    - "No image is generated at request time"
    - "Share images render locally and can be saved without an upload"
  labels: ["epic:zero-cost", "epic:seo", "type:feat", "priority:P2", "size:M"]
  milestone: M3 Premium Site

- title: "Keep analytics and error reporting free-tier sized"
  epic: zero-cost
  why: "Telemetry is billed per event, and a games site generates a lot of events. Unsampled reporting can cost more than the hosting it monitors."
  actions:
    - "Sample events rather than sending everything, and document the sampling rate"
    - "Batch and send on idle rather than per interaction"
    - "Choose providers with a workable free tier, or self-host a lightweight collector"
    - "Cap the client so a bug cannot flood the endpoint"
  acceptance:
    - "Event volume stays inside the free tier at the projected traffic"
    - "A client-side error loop cannot generate unbounded reports"
  labels: ["epic:zero-cost", "epic:analytics", "type:feat", "priority:P2", "size:M"]
  milestone: M3 Premium Site

- title: "Add a deploy that works on any static host"
  epic: zero-cost
  why: "Free tiers change their terms. If the build output is ordinary static files with no host-specific glue, moving providers is an afternoon rather than a rewrite."
  actions:
    - "Keep the build output a plain directory of files with no proprietary adapter"
    - "Document deploying it to at least two different static hosts"
    - "Keep host-specific configuration - headers, redirects - in one small, replaceable file"
    - "Verify a deploy to a second host actually works before launch"
  acceptance:
    - "The same build artefact deploys to two different hosts unchanged"
    - "Nothing in the application code depends on a particular provider"
  labels: ["epic:zero-cost", "epic:setup", "type:chore", "priority:P2", "size:M"]
  milestone: M3 Premium Site

- title: "Guard the zero-cost properties in CI"
  epic: zero-cost
  why: "These properties decay quietly. One convenient server call added during a busy week turns a free site into a metered one, and nobody notices until the invoice."
  actions:
    - "Assert the build output contains no server runtime"
    - "Assert no gameplay module imports a network client"
    - "Assert the per-session byte budget"
    - "Fail the build when a new route opts into request-time rendering"
  acceptance:
    - "Each property has a CI check that fails on regression"
    - "The checks name the property they protect, so a failure explains itself"
  labels: ["epic:zero-cost", "epic:qa", "type:chore", "priority:P1", "size:M"]
  milestone: M3 Premium Site

- title: "Build the per-game artwork system: one illustrated tile per game"
  epic: originality
  why: "Every one of the 107 games needs its own picture, or the catalogue is a wall of text. The reference app draws a full illustration per game; ours must be as recognisable but cheap enough to ship 107 of on a byte budget, and generated consistently rather than commissioned one at a time."
  actions:
    - "Define the tile anatomy: a flat background tint from the palette, one bold central mark that says what the game is, and the two-player dots - the game's NAME always sits with the tile, never inside the art"
    - "Draw the marks as flat SVG on a shared grid with the same stroke weight and corner radius, so 107 tiles read as one set"
    - "Assign each game a tint and a mark in the catalogue data, so a new game is two data fields rather than a new asset"
    - "Generate the raster thumbnails and social cards from the SVG at build time"
    - "Record every mark in the asset licence manifest as original work"
  acceptance:
    - "All 107 games have a distinct tile that is recognisable at 128px and at 32px"
    - "The whole set fits inside the catalogue byte budget"
    - "Adding a game needs no new hand-drawn asset"
    - "Nothing is traced from or derived from another product's art"
  labels: ["epic:originality", "epic:design", "epic:perf", "type:feat", "priority:P1", "size:L", "needs-design"]
  milestone: M2 Game Catalog

- title: "Design the launch sequence"
  epic: originality
  why: "The first two seconds decide whether the site reads as a cheap games portal or a made thing. A short, deliberate opening is one of the few places a games site can show craft before anything is played."
  actions:
    - "Design a brief opening beat that resolves into the hero rather than delaying it - the page must be interactive throughout"
    - "Bring the two characters in as part of it, so the cast is established before the catalogue"
    - "Cap it hard: it must never delay the largest contentful paint or block first input"
    - "Skip it entirely under reduced-motion, on a repeat visit, and on a low-end device"
  acceptance:
    - "The opening never delays interactivity, measured not assumed"
    - "It plays once per visit at most, and never on a return within the session"
    - "Reduced-motion goes straight to the hero"
  labels: ["epic:originality", "epic:perf", "epic:a11y", "type:feat", "priority:P2", "size:M", "needs-design"]
  milestone: M3 Premium Site
